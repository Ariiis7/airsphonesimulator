function ensureMemoryEntries(ch){
  if(!Array.isArray(ch.memoryEntries)) ch.memoryEntries = [];
  return ch.memoryEntries;
}

function renderSettingsMemory(){
  const body = document.getElementById('settingsMemoryBody');
  const ch = getCurrentChar();
  if(!ch){ body.innerHTML='<div class="empty-state">'+t('toast.charMissing')+'</div>'; return; }
  const entries = ensureMemoryEntries(ch);
  let html = '<div class="field-hint" style="margin-bottom:14px;">'+t('memory.hint')+'</div>';
  if(!entries.length){
    html += '<div class="empty-state">'+t('memory.empty')+'</div>';
  } else {
    entries.forEach((en,i)=>{
      html += '<div class="note-item" data-mem-idx="'+i+'">'
        + '<div class="note-title">'+escapeHtml(en.title||'')+'</div>'
        + '<div class="note-preview">'+escapeHtml((en.content||'').slice(0,50))+'</div>'
        + '</div>';
    });
  }
  html += '<button class="btn-block" id="memAddBtn">'+t('memory.add')+'</button>';
  body.innerHTML = html;
  body.querySelectorAll('[data-mem-idx]').forEach(el=>{
    el.addEventListener('click', ()=>openMemoryEntry(parseInt(el.getAttribute('data-mem-idx'),10)));
  });
  document.getElementById('memAddBtn').addEventListener('click', ()=>openMemoryEntry(null));
}

let _editingMemIdx = null;
let _editingMemDraft = null;

function openMemoryEntry(idx){
  const ch = getCurrentChar();
  const entries = ensureMemoryEntries(ch);
  _editingMemIdx = idx;
  if(idx===null){
    _editingMemDraft = {id:uid('mem'), title:t('memory.defaultTitle').replace('{n}', entries.length+1), content:''};
  } else {
    _editingMemDraft = JSON.parse(JSON.stringify(entries[idx]));
  }
  document.getElementById('memEditTitle').textContent = _editingMemDraft.title || 'Memory';
  goTo('screen-settings-memory-edit');
  renderMemoryEntryForm();
}

function renderMemoryEntryForm(){
  const d = _editingMemDraft;
  const body = document.getElementById('memEditBody');
  body.innerHTML =
    '<div class="field-label">'+t('memory.titleLabel')+'</div>'
    + '<input type="text" class="field-input" id="memTitleInput" value="'+escapeHtml(d.title)+'">'
    + '<div class="field-label">&nbsp;</div>'
    + '<textarea class="field-textarea" id="memContentInput" style="min-height:240px;" placeholder="'+t('memory.contentPlaceholder')+'">'+escapeHtml(d.content)+'</textarea>'
    + (_editingMemIdx!==null ? '<button class="btn-block danger" id="memDeleteBtn">'+t('memory.delete')+'</button>' : '');

  document.getElementById('memTitleInput').addEventListener('input', e=>{
    d.title = e.target.value;
    document.getElementById('memEditTitle').textContent = d.title || 'Memory';
  });
  document.getElementById('memContentInput').addEventListener('input', e=>{ d.content = e.target.value; });

  const delBtn = document.getElementById('memDeleteBtn');
  if(delBtn){
    delBtn.addEventListener('click', ()=>{
      const ch = getCurrentChar();
      const entries = ensureMemoryEntries(ch);
      entries.splice(_editingMemIdx,1);
      saveState();
      showToast(t('toast.memDeleted'));
      goBack();
      renderSettingsMemory();
    });
  }
}

function saveMemoryEntry(){
  const ch = getCurrentChar();
  if(!ch) return;
  const entries = ensureMemoryEntries(ch);
  if(_editingMemIdx===null) entries.push(_editingMemDraft);
  else entries[_editingMemIdx] = _editingMemDraft;
  saveState();
  showToast(t('toast.memSaved'));
  goBack();
  renderSettingsMemory();
}

document.getElementById('memSaveBtn').addEventListener('click', saveMemoryEntry);

const BUBBLE_APPLE_SENT_DARK = ['','#0a84ff','#30d158','#ff453a','#ffd60a','#bf5af2','#ff9f0a','#64d2ff'];
const BUBBLE_APPLE_RECV_DARK = ['','#262627','#1c3a52','#2d4a3e','#3d2b4a','#2a3a4a','#4a2b2b','#1e3d59'];
const BUBBLE_APPLE_SENT_LIGHT = ['','#0071e3','#34c759','#ff3b30','#ffd60a','#7d3c98','#ff9f0a','#5ac8fa'];
const BUBBLE_APPLE_RECV_LIGHT = ['','#ececee','#e8f4fd','#e9f7ef','#fef9e7','#f4ecf7','#fdebd0','#f9ebea'];

function showChatColorPicker(context){
  const dd = document.getElementById('chatDropdown');
  if(dd) dd.style.display='none';
  const s = state.settings;
  const ctx = context || 'chat';
  const colors = s[ctx+'Colors'] || {sent:'',recv:''};
  const isDark = (s.theme||'dark')==='dark';
  const sentPresets = isDark ? BUBBLE_APPLE_SENT_DARK : BUBBLE_APPLE_SENT_LIGHT;
  const recvPresets = isDark ? BUBBLE_APPLE_RECV_DARK : BUBBLE_APPLE_RECV_LIGHT;

  const overlay = document.getElementById('promptOverlay');
  const card = document.getElementById('promptCard');

  function previewHtml(){
    const sc = colors.sent || (isDark?'#f2f2f3':'#0e0e0f');
    const rc = colors.recv || (isDark?'#262627':'#ececee');
    const stc = colors.sent ? (isLightColor(sc)?'#0a0a0a':'#ffffff') : (isDark?'#0a0a0a':'#ffffff');
    const rtc = colors.recv ? (isLightColor(rc)?'#0a0a0a':'#ffffff') : (isDark?'#f2f2f3':'#0a0a0a');
    return '<div style="display:flex;flex-direction:column;gap:6px;margin:10px 0 14px;padding:10px 12px;background:var(--surface-3);border-radius:14px;">'
      +'<div style="display:flex;justify-content:flex-end;"><div style="background:'+sc+';color:'+stc+';font-size:13px;padding:7px 13px;border-radius:18px 18px 4px 18px;max-width:75%;">'+t('preview.myMsg')+'</div></div>'
      +'<div style="display:flex;justify-content:flex-start;"><div style="background:'+rc+';color:'+rtc+';font-size:13px;padding:7px 13px;border-radius:18px 18px 18px 4px;max-width:75%;">'+t('preview.theirMsg')+'</div></div>'
      +'</div>';
  }

  function swatchRow(presets, cur, type){
    return '<div class="color-swatches" id="'+type+'Swatches">'
      + presets.map((c,i)=>{
        const bg = c || (type==='sent' ? (isDark?'#f2f2f3':'#0e0e0f') : (isDark?'#262627':'#ececee'));
        const active = (!c && !cur) || c===cur;
        // Default swatch: just show the color, no X
        return '<div class="color-swatch'+(active?' active':'')+'" data-color="'+c+'" data-type="'+type+'" style="background:'+bg+';">'
        +'</div>';
      }).join('')
      + '<label class="color-swatch color-swatch-custom" title="Custom" style="cursor:pointer;display:flex;align-items:center;justify-content:center;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);border:2px solid var(--border);">'
        + '<input type="color" data-custom-type="'+type+'" style="opacity:0;position:absolute;width:0;height:0;" value="'+(cur&&cur!==''?cur:'#ffffff')+'">'
        + '<svg viewBox="0 0 14 14" style="width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2;filter:drop-shadow(0 0 1px #000);"><path d="M1 7h12M7 1v12"/></svg>'
      + '</label>'
    + '</div>';
  }

  card.innerHTML =
    '<div class="prompt-card-title">'+t('menu.bubbleColor')+'</div>'
    + '<div id="colorPickerPreview">'+previewHtml()+'</div>'
    + '<div style="font-size:11px;color:var(--text-3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em;">'+t('color.mySide')+'</div>'
    + swatchRow(sentPresets, colors.sent, 'sent')
    + '<div style="font-size:11px;color:var(--text-3);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.06em;">'+t('color.theirSide')+'</div>'
    + swatchRow(recvPresets, colors.recv, 'recv')
    + '<div class="prompt-card-actions" style="margin-top:16px;">'
      + '<button class="pc-cancel" data-v="__reset">'+t('btn.reset')+'</button>'
      + '<button class="pc-ok" data-v="__close">'+t('btn.done')+'</button>'
    + '</div>';
  overlay.classList.add('open');

  function applyColor(type, color){
    if(!s[ctx+'Colors']) s[ctx+'Colors'] = {sent:'',recv:''};
    s[ctx+'Colors'][type] = color;
    Object.assign(colors, s[ctx+'Colors']);
    saveState();
    applyChatColors();
    document.getElementById('colorPickerPreview').innerHTML = previewHtml();
    card.querySelectorAll('.color-swatch[data-type="'+type+'"]').forEach(sw=>{
      const c = sw.getAttribute('data-color');
      sw.classList.toggle('active', c===color || (c==='' && color===''));
    });
  }

  card.querySelectorAll('.color-swatch[data-color]').forEach(sw=>{
    sw.addEventListener('click', ()=>{
      const type = sw.getAttribute('data-type');
      const color = sw.getAttribute('data-color');
      applyColor(type, color);
    });
  });

  card.querySelectorAll('input[type="color"]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const type = inp.getAttribute('data-custom-type');
      applyColor(type, inp.value);
    });
  });

  function close(){ overlay.classList.remove('open'); overlay.removeEventListener('click', onClick); renderUserChatFeed(); }
  function onClick(e){
    const btn = e.target.closest('[data-v]');
    if(!btn){ if(e.target===overlay) close(); return; }
    const v = btn.getAttribute('data-v');
    if(v==='__reset'){
      if(!s[ctx+'Colors']) s[ctx+'Colors']={sent:'',recv:''};
      s[ctx+'Colors'] = {sent:'',recv:''};
      Object.assign(colors, {sent:'',recv:''});
      saveState();
      applyChatColors();
    }
    close();
  }
  overlay.addEventListener('click', onClick);
}

function isLightColor(hex){
  if(!hex||hex==='') return false;
  const c = hex.replace('#','');
  if(c.length<6) return false;
  const r=parseInt(c.slice(0,2),16), g=parseInt(c.slice(2,4),16), b=parseInt(c.slice(4,6),16);
  return (0.299*r+0.587*g+0.114*b) > 160;
}

  let html = '<div class="bubble-row '+(mine?'sent':'recv')+'" data-msg-id="'+m.id+'">';
  if(!mine && showRecvAv){
    const av = ch && ch.idolAvatar ? avatarStyle(ch.idolAvatar) : '';
    const init = ch ? avatarInitial(ch.idolName) : '?';
    html += '<div class="chat-avatar" style="'+(av||'')+'">'+(av?'':init)+'</div>';
  }
  html += '<div class="bubble '+(mine?'sent':'recv')+'" style="'+(mine?sentStyle:recvStyle)+'">'+escapeHtml(m.text)+'</div>';

    const init = ch ? avatarInitial(ch.userName) : '我';
    html += '<div class="chat-avatar" style="'+(av||'')+'">'+(av?'':init)+'</div>';
  }
  html += '</div>';
  return html;
}

async function generateOffline(){
  const ch = getCurrentChar();
  if(!ch){ showToast(t('toast.charMissing')); closeOfflineSettings(); return; }
  if(!normalizeBaseUrl(state.settings.apiUrl) || !state.settings.model){ showToast(t('toast.apiMissing')); closeOfflineSettings(); return; }

  const promptInput = document.getElementById('offlinePromptInput');
  const extraPrompt = promptInput ? promptInput.value.trim() : '';

  // Save preset if toggle on
  if(state.settings.offlineSavePreset && extraPrompt){
    if(!state.settings.offlinePresets) state.settings.offlinePresets = [];
    if(!state.settings.offlinePresets.includes(extraPrompt)){
      state.settings.offlinePresets.push(extraPrompt);
    }
    saveState();
  }

  const useExtra = state.settings.offlineApplyPrompt !== false;

  closeOfflineSettings();

  const body = document.getElementById('offlineBody');
  body.innerHTML = '<div class="loading-row">'+t('toast.generating')+'</div>';
  showPhoneGenerating();

  try{
    const memCtx = recentUserChatContext(ch, 6);
    const sys = buildBaseSystemPrompt(ch,
      '现在请为用户和idol生成一段线下相遇、约会或互动的小说式场景描写。'
      + '内容要求：至少350字，包含详细的动作描写、环境描写、心理描写，以及真实自然的对话（用引号表示）。'
      + '风格类似现代言情或青春小说，有画面感、有情感张力，细节丰富。'
      + (useExtra && extraPrompt ? '\n【用户额外要求】'+extraPrompt : '')
    );
    const usr = '请生成用户（'+(ch.userName||'用户')+'）与idol（'+(ch.idolName||'idol')+'）的一段线下互动场景，至少350字。场景要有地点、时间背景、具体的行为动作、对话和情感细节。输出纯文本（不需要JSON格式）。';
    const text = await callAPI(sys, usr);
    if(!text) throw new Error('empty');
    const ch2 = getCurrentChar();
    const pd2 = ensurePhoneData(ch2);
    if(!pd2.offlineScenes) pd2.offlineScenes = [];
    pd2.offlineScenes.unshift({text, time: new Date().toLocaleDateString('zh-CN')});
    saveState();
    renderOfflineChatMsgs();
  }catch(err){
    console.warn(err);
    showToast(t('toast.genFailed')+': '+(err && err.message ? err.message : String(err)));
    renderOfflineBody();
  }finally{
    hidePhoneGenerating();
  }
}

function renderOfflineBody(){
  const ch = getCurrentChar();
  const pd = ch ? ensurePhoneData(ch) : null;
  const scenes = pd && pd.offlineScenes ? pd.offlineScenes : [];
  const body = document.getElementById('offlineBody');
  if(!scenes.length){
    body.innerHTML = '<div class="empty-state" style="padding:80px 20px;">点击右上角菜单生成线下内容</div>';
    return;
  }
  renderOfflineScene(scenes[0].text, scenes[0].time);
  // Wire offline chat bar
  wireOfflineChatBar();
}

function wireOfflineChatBar(){
  const sendBtn = document.getElementById('offlineSendBtn');
  const triggerBtn = document.getElementById('offlineTriggerBtn');
  const input = document.getElementById('offlineChatInput');
  if(!sendBtn || !triggerBtn || !input) return;
  // Prevent duplicate listeners
  sendBtn.onclick = ()=>{
    const val = input.value.trim();
    if(!val) return;
    input.value='';
    const ch = getCurrentChar();
    if(!ch) return;
    const pd = ensurePhoneData(ch);
    if(!pd.offlineChatMsgs) pd.offlineChatMsgs = [];
    pd.offlineChatMsgs.push({from:'me', text:val, id:uid('oc'), ts:Date.now()});
    saveState();
    renderOfflineChatMsgs();
  };
  input.onkeydown = (e)=>{ if(e.key==='Enter') sendBtn.click(); };
  triggerBtn.onclick = async()=>{
    const ch = getCurrentChar();
    if(!ch){ showToast(t('toast.charMissing')); return; }
    if(!normalizeBaseUrl(state.settings.apiUrl)||!state.settings.model){ showToast(t('toast.apiMissing')); return; }
    const pd = ensurePhoneData(ch);
    if(!pd.offlineChatMsgs) pd.offlineChatMsgs=[];
    showPhoneGenerating();
    try{
      const sceneCtx = (pd.offlineScenes&&pd.offlineScenes.length) ? '\n【当前线下场景】\n'+pd.offlineScenes[0].text.slice(0,400) : '';
      const hist = pd.offlineChatMsgs.slice(-10).map(m=>(m.from==='me'?(ch.userName||'用户'):(ch.idolName||'idol'))+'：'+m.text).join('\n');
      const sys = buildBaseSystemPrompt(ch,
        '现在你们正在线下相处，请以idol身份自然地回复用户说的话。语气亲近自然，符合当前场景和两人关系。可以发1-4条消息。'+sceneCtx
      );
      const usr = hist+'\n\n请以idol身份继续对话，输出JSON：{"messages":["消息1",...]}';
      const data = await generateJSON(sys,usr);
      if(data&&Array.isArray(data.messages)&&data.messages.length){
        const now=Date.now();
        data.messages.filter(Boolean).forEach((txt,i)=>{
          pd.offlineChatMsgs.push({from:'them',text:txt.trim(),id:uid('oc'),ts:now+i*1000});
        });
        saveState();
        renderOfflineChatMsgs();
      }
    }catch(err){ showToast(t('toast.genFailed')); }
    finally{ hidePhoneGenerating(); }
  };
}

function renderOfflineChatMsgs(){
  const ch = getCurrentChar();
  const pd = ch ? ensurePhoneData(ch) : null;
  const msgs = pd && pd.offlineChatMsgs ? pd.offlineChatMsgs : [];
  const body = document.getElementById('offlineBody');
  const scenes = pd && pd.offlineScenes ? pd.offlineScenes : [];
  let html = '';
  if(scenes.length){
    const s = scenes[0];
    html += (s.time ? '<div style="font-size:11px;color:var(--text-3);margin-bottom:8px;">'+escapeHtml(s.time)+'</div>' : '')
      + '<div class="detail-text" style="line-height:1.9;font-size:14px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border);">'+escapeHtml(s.text)+'</div>';
  }
  msgs.forEach(m=>{
    const mine = m.from==='me';
    html += '<div class="bubble-row '+(mine?'sent':'recv')+'" style="margin:4px 0;">'
      +'<div class="bubble '+(mine?'sent':'recv')+'">'+escapeHtml(m.text)+'</div>'
      +'</div>';
  });
  body.innerHTML = html || '<div class="empty-state">点击右上角菜单生成场景内容</div>';
  body.scrollTop = body.scrollHeight;
}

function renderOfflineScene(text, time){
  const body = document.getElementById('offlineBody');
  body.innerHTML =
    (time ? '<div style="font-size:11px;color:var(--text-3);margin-bottom:12px;">'+escapeHtml(time)+'</div>' : '')
    + '<div class="detail-text" style="line-height:1.9;font-size:14.5px;">'+escapeHtml(text)+'</div>';
}

function openOfflineApp(){
  goTo('screen-offline');
  const ch = getCurrentChar();
  if(ch){ ensurePhoneData(ch); }
  renderOfflineBody();
}

/* ===================================================================
   CHAT TIMESTAMPS — insert time dividers every 30 min gap
=================================================================== */
function formatMsgTime(ts){
  if(!ts) return '';
  const d = new Date(ts);
  const h = d.getHours(), m = d.getMinutes();
  return (h<10?'0'+h:h)+':'+(m<10?'0'+m:m);
}
function formatMsgDate(ts){
  if(!ts) return '';
  const d = new Date(ts);
  const now = new Date();
  const diff = now - d;
  const lang = state.settings.language || 'zh';
  const isEn = lang === 'en';
  // < 1 min: just now
  if(diff < 60000) return isEn ? 'Now' : '刚刚';
  // < 60 min: X min ago / X分钟前
  if(diff < 3600000){
    const mins = Math.floor(diff/60000);
    return isEn ? mins+'m' : mins+'分钟前';
  }
  // Same day: HH:MM
  const sameDay = d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
  if(sameDay) return formatMsgTime(ts);
  // < 7 days: weekday + time
  if(diff < 604800000){
    if(isEn){
      const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      return days[d.getDay()]+' '+formatMsgTime(ts);
    } else {
      const days=['日','一','二','三','四','五','六'];
      return '周'+days[d.getDay()]+' '+formatMsgTime(ts);
    }
  }
  // Older: date + time
  if(isEn) return (d.getMonth()+1)+'/'+(d.getDate())+' '+formatMsgTime(ts);
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+formatMsgTime(ts);
}

function msgsWithTimestamps(messages){
  // Insert time divider objects into array every 30min gap or at start
  const THRESHOLD = 30 * 60 * 1000; // 30 min
  const result = [];
  let lastTs = 0;
  messages.forEach(m=>{
    const ts = m.ts || 0;
    if(!lastTs || (ts && ts - lastTs > THRESHOLD)){
      result.push({_divider: true, ts: ts || Date.now()});
    }
    result.push(m);
    if(ts) lastTs = ts;
  });
  return result;
}

function addDmAsContact(){

  const ch=getCurrentChar(); if(!ch) return;
  const {scope,idx}=currentDmCtx;

  const memLines = dm.messages.map(m=>(m.from==='me'?(ch.userName||'用户'):dm.name)+'：'+m.text).join('\n');
  upd.userChat.contacts.push({
    name:dm.name, tag:dm.tag||'', scope, dmIdx:idx,

  });

/* ===================================================================
   DM LIST — sort by last message time, show preserved, show time
=================================================================== */
function dmListHtml(dms, scope){
  // Sort: pinned first, then by last message ts desc
  const sorted = dms.map((d,i)=>({d,i})).sort((a,b)=>{
    if(a.d.pinned && !b.d.pinned) return -1;
    if(!a.d.pinned && b.d.pinned) return 1;
    const ta = (a.d.messages[a.d.messages.length-1]||{}).ts||0;
    const tb = (b.d.messages[b.d.messages.length-1]||{}).ts||0;
    return tb - ta;
  });
  return sorted.map(({d,i})=>{
    const last = d.messages[d.messages.length-1];
    const ts = last ? last.ts : 0;
    const timeStr = ts ? formatMsgDate(ts) : '';
    return '<div class="dm-list-item" data-dm-idx="'+i+'"'+(d.pinned?' style="background:var(--surface-2);"':'')+'>'
      + '<div class="ig-avatar" style="position:relative;">'+(d.pinned?'<div style="position:absolute;bottom:-2px;right:-2px;width:12px;height:12px;background:var(--accent);border-radius:50%;border:1.5px solid var(--bg);"></div>':'')+'</div>'
      + '<div class="dm-list-text"><div class="dm-list-name">'+escapeHtml(d.name)+'<span class="dm-list-tag">'+escapeHtml(d.tag||'')+'</span></div>'
      + '<div class="dm-list-preview">'+escapeHtml(last? (last.type==='transfer'?'[转账]':last.text) : '')+'</div></div>'
      + (timeStr ? '<div class="dm-list-time">'+timeStr+'</div>' : '')
    + '</div>';
  }).join('');
}

/* ===================================================================
   RENDER DM FEED WITH TIMESTAMPS
=================================================================== */
function renderMsgFeedHtml(messages, ch, isChat){
  if(!messages.length) return '<div class="empty-state">'+t('empty.dm')+'</div>';
  const THRESHOLD = 30*60*1000;
  let lastTs = 0;
  let html = '';
  messages.forEach(m=>{
    const ts = m.ts || 0;
    if(ts && (!lastTs || ts - lastTs > THRESHOLD)){
      html += '<div class="chat-time-divider"><span>'+formatMsgDate(ts)+'</span></div>';
      lastTs = ts;
    }
    if(m.type==='transfer'){
      html += transferMsgHtml(m, ch);
    } else {
      const mine = m.from==='me';
      if(isChat){
        html += chatMsgHtml(m, ch);
      } else {
        html += '<div class="bubble-row '+(mine?'sent':'recv')+'" data-msg-id="'+m.id+'"><div class="bubble '+(mine?'sent':'recv')+'">'+escapeHtml(m.text)+'</div></div>';
      }
    }
  });
  return html;
}

/* Track current contact chat index */

/* ===================================================================
   CONTACT CHATS in user phone (people added from DM)
=================================================================== */
function getUserContactChats(ch){
  const pd = ch ? ensurePhoneData(ch) : null;
  return (pd && pd.userContactChats) ? pd.userContactChats : [];
}

/* ===================================================================
   CHAT LIST — shown when opening Chat app on user phone
=================================================================== */
function renderChatList(){
  const ch = getCurrentChar();
  const body = document.getElementById('chatListBody');
  if(!ch){
    body.innerHTML = '<div class="empty-state">'+t('empty.noChar')+'</div>';
    return;
  }
  const pd = ensurePhoneData(ch);
  // Build list: main chat with idol + any contact chats
  const mainChat = pd.userChat;
  const mainLast = mainChat.messages[mainChat.messages.length-1];
  const mainTs = mainLast ? (mainLast.ts||0) : 0;
  const mainPreview = mainLast ? (mainLast.recalled ? t('toast.recalled') : mainLast.text) : '';
  const mainName = (mainChat.idolNickname||ch.idolName||'Chat');

  // Contact chats from DMs added
  const contacts = getUserContactChats(ch);

  // Combine and sort by ts desc
  const allChats = [{type:'main', name:mainName, preview:mainPreview, ts:mainTs, avatar:ch.idolAvatar}];
  contacts.forEach((c,i)=>{
    const last = c.messages && c.messages[c.messages.length-1];
    allChats.push({type:'contact', idx:i, name:c.name||t('contact.default'), preview:last?(last.recalled?t('toast.recalled'):last.text):'', ts:last?(last.ts||0):0, avatar:''});
  });
  allChats.sort((a,b)=>b.ts-a.ts);

  if(!allChats.length){
    body.innerHTML = '<div class="empty-state">'+t('empty.chat')+'</div>';
    return;
  }
  body.innerHTML = allChats.map(item=>{
    const timeStr = item.ts ? formatMsgDate(item.ts) : '';
    const avStyle = item.avatar ? avatarStyle(item.avatar) : '';
    const avInit = item.name ? item.name.slice(0,1) : '?';
    return '<div class="dm-list-item chat-list-entry" data-chat-type="'+item.type+'" data-chat-idx="'+(item.idx||0)+'">'
      +'<div class="ig-avatar" style="'+(avStyle||'')+'">'+(avStyle?'':avInit)+'</div>'
      +'<div class="dm-list-text">'
        +'<div class="dm-list-name">'+escapeHtml(item.name)+'</div>'
        +'<div class="dm-list-preview">'+escapeHtml(item.preview)+'</div>'
      +'</div>'
      +(timeStr?'<div class="dm-list-time">'+timeStr+'</div>':'')
    +'</div>';
  }).join('');

  body.querySelectorAll('.chat-list-entry').forEach(el=>{
    el.addEventListener('click', ()=>{
      const type = el.getAttribute('data-chat-type');
      if(type==='main'){
        goTo('screen-userchat');
        renderUserChat();
      } else {
        const idx = parseInt(el.getAttribute('data-chat-idx'),10);
        openContactChat(idx);
      }
    });
  });
}

function openContactChat(idx){
  const ch = getCurrentChar();
  if(!ch) return;
  const contacts = getUserContactChats(ch);
  const c = contacts[idx];
  if(!c) return;
  _currentContactIdx = idx;
  goTo('screen-userchat');
  const titleEl = document.getElementById('userChatTitle');
  titleEl.textContent = c.name||'联系人';
  titleEl.onclick = null;
  const feed = document.getElementById('userChatFeed');
  c.messages = c.messages||[];
  c.messages.forEach(m=>{ if(!m.id) m.id=uid('m'); if(!m.ts) m.ts=0; });
  feed.innerHTML = renderMsgFeedHtml(c.messages, ch, true);
  feed.scrollTop = feed.scrollHeight;

  // Wire input bar to this contact
  const input = document.getElementById('userChatInput');
  const sendBtn = document.getElementById('userChatSendBtn');
  const triggerBtn = document.getElementById('userChatTriggerBtn');

  // Replace send handlers for contact chat
  sendBtn.onclick = ()=>{
    const val = input.value.trim();
    if(!val) return;
    input.value='';
    const m = {from:'me', text:val, id:uid('m'), ts:Date.now()};
    c.messages.push(m);
    saveState();
    // Re-render feed
    c.messages.forEach(msg=>{ if(!msg.id) msg.id=uid('m'); if(!msg.ts) msg.ts=0; });
    feed.innerHTML = renderMsgFeedHtml(c.messages, ch, true);
    feed.scrollTop = feed.scrollHeight;
    renderChatList();
  };
  input.onkeydown = (e)=>{ if(e.key==='Enter') sendBtn.onclick(); };
  triggerBtn.onclick = async ()=>{
    const currentCh = getCurrentChar();
    if(!currentCh){ showToast(t('toast.charMissing')); return; }
    if(!normalizeBaseUrl(state.settings.apiUrl)||!state.settings.model){ showToast(t('toast.apiMissing')); return; }
    const currentContacts = getUserContactChats(currentCh);
    const currentC = currentContacts[idx];
    if(!currentC) return;
    showPhoneGenerating();
    try{
      const speaker = currentCh.userName||'用户';
      const history = (currentC.messages||[]).map(m=>(m.from==='me'?speaker:currentC.name)+'：'+m.text).join('\n');
      const sys = buildBaseSystemPrompt(currentCh, '现在请扮演「'+currentC.name+'」（'+(currentC.tag||'联系人')+'），根据对话历史自然地回复用户。');
      const usr = '对话历史：\n'+history+'\n\n请生成「'+currentC.name+'」接下来发的消息。\n输出 JSON：{"messages":["消息1","消息2",...]}';
      const data = await generateJSON(sys, usr);
      if(data && Array.isArray(data.messages) && data.messages.length){
        const now=Date.now();
        const newMsgs=data.messages.filter(t=>t&&t.trim()).map((t,i)=>({from:'them',text:t.trim(),id:uid('m'),ts:now+i*1000}));
        newMsgs.forEach(m=>currentC.messages.push(m));
        saveState();
        currentC.messages.forEach(msg=>{ if(!msg.id) msg.id=uid('m'); if(!msg.ts) msg.ts=0; });
        feed.innerHTML = renderMsgFeedHtml(currentC.messages, currentCh, true);
        feed.scrollTop = feed.scrollHeight;
        renderChatList();
      }
    }catch(err){ showToast(t('toast.genFailed')); }
    finally{ hidePhoneGenerating(); }
  };
  applyBubbleScale();
}
