<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idol Phone Simulator</title>
<style>
/* ===================== RESET & BASE ===================== */
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#0a0a0a;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
  padding:24px;
}
#app-root{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input{font-family:inherit;}
img{display:block;max-width:100%;}

/* ===================== THEME TOKENS ===================== */
#phone[data-theme="dark"]{
  --bg:#000000;
  --surface:#161617;
  --surface-2:#1f1f20;
  --surface-3:#2a2a2b;
  --text:#f2f2f3;
  --text-2:#9a9a9d;
  --text-3:#6b6b6e;
  --border:#2e2e2f;
  --accent:#f2f2f3;
  --accent-text:#000000;
  --sent-bg:#f2f2f3;
  --sent-text:#0a0a0a;
  --recv-bg:#262627;
  --recv-text:#f2f2f3;
  --danger:#cfcfcf;
  --shadow:0 18px 48px rgba(0,0,0,0.55);
}
#phone[data-theme="light"]{
  --bg:#f4f4f5;
  --surface:#ffffff;
  --surface-2:#f6f6f7;
  --surface-3:#ececee;
  --text:#0e0e0f;
  --text-2:#6f6f74;
  --text-3:#9b9b9f;
  --border:#e3e3e5;
  --accent:#0e0e0f;
  --accent-text:#ffffff;
  --sent-bg:#0e0e0f;
  --sent-text:#ffffff;
  --recv-bg:#ececee;
  --recv-text:#0e0e0f;
  --danger:#3a3a3a;
  --shadow:0 18px 48px rgba(0,0,0,0.18);
}

/* ===================== PHONE FRAME ===================== */
#phone{
  width:390px;
  height:844px;
  background:var(--bg);
  color:var(--text);
  border-radius:46px;
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  overflow:hidden;
  position:relative;
  display:flex;
  flex-direction:column;
}
.statusbar{
  height:46px;
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  font-size:14px;
  font-weight:600;
  letter-spacing:0.2px;
  color:var(--text);
  background:var(--bg);
  position:relative;
  z-index:50;
}
.statusbar:before{
  content:"";
  position:absolute;
  top:8px;left:50%;
  transform:translateX(-50%);
  width:90px;height:24px;
  background:#000000;
  border-radius:14px;
}
.sb-right{display:flex;gap:7px;align-items:center;}
.sb-signal{display:flex;align-items:flex-end;gap:2px;height:11px;}
.sb-signal-bar{width:3px;background:var(--text);border-radius:1px;}
.sb-signal-bar:nth-child(1){height:4px;}
.sb-signal-bar:nth-child(2){height:6px;}
.sb-signal-bar:nth-child(3){height:8.5px;}
.sb-signal-bar:nth-child(4){height:11px;}
.sb-wifi{width:16px;height:11px;display:flex;align-items:center;}
.sb-wifi svg{width:100%;height:100%;}
.sb-battery{display:flex;align-items:center;}
.sb-battery-body{
  width:25px;height:12px;border:1.5px solid var(--text);border-radius:3.5px;
  position:relative;padding:1.5px;
}
.sb-battery-body:after{
  content:"";position:absolute;left:100%;top:50%;transform:translateY(-50%);
  width:2px;height:5px;background:var(--text);border-radius:0 1.5px 1.5px 0;
}
.sb-battery-fill{height:100%;width:100%;background:#30d158;border-radius:1.5px;}
.sb-battery-nub{display:none;}

.screen{
  position:absolute;
  top:46px;left:0;right:0;bottom:0;
  background:var(--bg);
  display:none;
  flex-direction:column;
  overflow:hidden;
}
.screen.visible{display:flex;}
.home-screen{position:relative;top:0;height:100%;padding:18px 22px 28px;}

/* ===================== HOME SCREEN ===================== */
.owner-switch{
  display:flex;flex-direction:column;align-items:center;
  padding:22px 0 26px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.owner-avatar{
  width:72px;height:72px;border-radius:24px;
  background:var(--surface-3);
  background-size:cover;background-position:center;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:600;color:var(--text-2);
  border:1px solid var(--border);
  margin-bottom:10px;
  transition:transform .15s ease;
}
.owner-switch:active .owner-avatar{transform:scale(0.94);}
.owner-name{font-size:15px;font-weight:600;color:var(--text);}
.owner-hint{font-size:11px;color:var(--text-3);margin-top:3px;letter-spacing:.2px;}

.app-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:22px 14px;
}
.app-icon-wrap{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  -webkit-tap-highlight-color:transparent;
}
.app-icon{
  width:60px;height:60px;border-radius:16px;
  background:var(--surface-2);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  background-size:cover;background-position:center;
  transition:transform .12s ease;
}
.app-icon-wrap:active .app-icon{transform:scale(0.92);}
.app-icon svg{width:28px;height:28px;stroke:var(--text);fill:none;stroke-width:1.4;}
.app-icon-label{font-size:11px;color:var(--text-2);font-weight:500;text-align:center;}

/* ===================== APP HEADER ===================== */
.app-screen{padding-top:0;}
.app-header{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 14px;
  border-bottom:1px solid var(--border);
  background:var(--bg);
  position:relative;
  z-index:10;
}
.hdr-title{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  font-size:16px;font-weight:600;letter-spacing:.2px;
  white-space:nowrap;
  pointer-events:none;
}
.hdr-btn{
  font-size:14px;font-weight:500;color:var(--text);
  padding:6px 10px;border-radius:10px;
  white-space:nowrap;
  position:relative;z-index:1;
  display:inline-flex;align-items:center;gap:3px;
}
.hdr-btn:active{background:var(--surface-2);}
.hdr-spacer{width:34px;display:inline-block;}
.refresh-btn{color:var(--text-2);}
.back-btn:before{
  content:"";
  width:8px;height:8px;
  border-left:1.6px solid currentColor;
  border-bottom:1.6px solid currentColor;
  transform:rotate(45deg);
  margin-right:1px;
}
.icon-btn{
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  padding:0;
}
.icon-btn svg{width:17px;height:17px;stroke:var(--text-2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}

input, textarea{ outline:none; }
.field-input:focus, .field-textarea:focus, .thin-input:focus,
.prompt-card textarea:focus, #iconEditorName:focus{
  border-color:var(--text-2);
}

/* ===================== BUBBLE APP ===================== */
.bubble-feed{
  flex:1 1 auto;overflow-y:auto;
  padding:16px 14px 10px;
  display:flex;flex-direction:column;gap:4px;
}
.bubble-round{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.bubble-row{display:flex;gap:7px;}
.bubble-row.sent{justify-content:flex-end;}
.bubble-row.recv{justify-content:flex-start;}
.bubble{
  max-width:72%;
  padding:7px 11px;
  border-radius:18px;
  font-size:14px;
  line-height:1.44;
  word-break:break-word;
}
.bubble.sent{background:var(--sent-bg);color:var(--sent-text);border-bottom-right-radius:5px;}
.bubble.recv{background:var(--recv-bg);color:var(--recv-text);border-bottom-left-radius:5px;}
.bubble-photo{
  width:170px;height:170px;
  border-radius:16px;
  background:var(--surface-2);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  padding:14px;text-align:center;
  font-size:12px;color:var(--text-2);
  line-height:1.5;
}
.bubble-meta{font-size:11px;color:var(--text-3);margin:2px 4px;}
.fan-name{font-size:11px;color:var(--text-3);margin:0 4px 1px;}
.expand-toggle{
  align-self:flex-start;
  margin:2px 4px 0;
  font-size:12.5px;color:var(--text-2);
  text-decoration:underline;
  text-decoration-color:var(--border);
}
.fan-replies{
  display:flex;flex-direction:column;gap:8px;
  margin-top:6px;padding-left:2px;
  border-left:1px solid var(--border);
  padding-left:12px;margin-left:4px;
}
.fan-reply-item{display:flex;flex-direction:column;gap:2px;}
.bubble-inputbar{
  flex:0 0 auto;
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;
  border-top:1px solid var(--border);
  background:var(--surface);
}
.thin-input{
  flex:1 1 auto;
  height:32px;
  border-radius:16px;
  background:var(--surface-2);
  border:1px solid var(--border);
  padding:0 14px;
  font-size:13.5px;
  color:var(--text);
}
.thin-input::placeholder{color:var(--text-3);}
.photo-btn{
  width:30px;height:30px;border-radius:50%;
  background:var(--surface-2);
  border:1px solid var(--border);
  flex:0 0 auto;
  position:relative;
}
.photo-btn:before{
  content:"";position:absolute;inset:9px;
  border:1.3px solid var(--text-2);border-radius:3px;
}
.photo-btn:after{
  content:"";position:absolute;
  width:5px;height:5px;border-radius:50%;
  border:1.3px solid var(--text-2);
  top:50%;left:50%;transform:translate(-50%,-50%);
}
.send-btn{
  flex:0 0 auto;
  width:30px;height:30px;
  border-radius:50%;
  background:var(--surface-2);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  padding:0;
}
.send-btn svg{width:15px;height:15px;stroke:var(--text);fill:none;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;}
.send-btn:disabled{opacity:.4;}
.chat-trigger-btn{
  flex:0 0 auto;
  width:30px;height:30px;
  border-radius:50%;
  background:var(--surface-2);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  padding:0;
}
.chat-trigger-btn svg{width:15px;height:15px;stroke:var(--text-2);fill:none;stroke-width:1.4;}
.loading-row{
  text-align:center;font-size:12px;color:var(--text-3);
  padding:10px 0;
}

/* ===================== INSTAGRAM ===================== */
.ig-tabs{
  flex:0 0 auto;
  display:flex;border-bottom:1px solid var(--border);
}
.ig-tab{
  flex:1 1 auto;
  padding:10px 0;font-size:13px;color:var(--text-3);font-weight:600;
  border-bottom:2px solid transparent;
}
.ig-tab.active{color:var(--text);border-bottom-color:var(--text);}
.ig-body{flex:1 1 auto;overflow-y:auto;}
.ig-pane{display:none;padding:14px;}
.ig-pane.active{display:block;}

.ig-post{
  border-bottom:1px solid var(--border);
  padding-bottom:12px;margin-bottom:12px;
}
.ig-post-head{display:flex;align-items:center;gap:9px;margin-bottom:7px;}
.ig-avatar{
  width:32px;height:32px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--border);
  background-size:cover;background-position:center;
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;color:var(--text-2);
}
.ig-post-name{font-size:13px;font-weight:600;}
.ig-post-time{font-size:11px;color:var(--text-3);}
.ig-image-block{
  width:100%;aspect-ratio:1/1;
  border-radius:12px;
  background:var(--surface-2);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  text-align:center;padding:16px;
  font-size:12px;color:var(--text-2);line-height:1.6;
  margin-bottom:8px;
}
.ig-caption{font-size:13px;line-height:1.5;margin-bottom:6px;}
.ig-likes{font-size:11.5px;color:var(--text-3);margin-bottom:6px;}
.ig-stats{display:flex;gap:14px;margin-bottom:7px;}
.ig-stat{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-2);}
.ig-stat svg{width:14px;height:14px;stroke:var(--text-2);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;}
.ig-comment{font-size:12px;margin-bottom:8px;line-height:1.5;}
.ig-comment b{font-weight:600;margin-right:5px;}

.ig-alt-trigger{
  display:inline-flex;align-items:center;justify-content:center;
  width:10px;height:10px;
  margin-left:4px;
  opacity:.55;
  pointer-events:auto;
  cursor:pointer;
  vertical-align:middle;
  position:relative;
  top:-1px;
}
.ig-alt-trigger:after{content:"";width:6px;height:6px;border-radius:50%;background:var(--text);}
.ig-alt-trigger-wrap{display:inline-flex;align-items:center;width:auto;}

.home-screen{background-size:cover;background-position:center;}
.home-screen.has-wallpaper .owner-name,
.home-screen.has-wallpaper .owner-hint,
.home-screen.has-wallpaper .app-icon-label{
  text-shadow:0 1px 5px rgba(0,0,0,0.65);
}

#phone.fit-screen{
  width:100vw;height:100vh;border-radius:0;border:none;
}
body.has-fit-screen{padding:0;}

.search-history-wrap{margin-bottom:18px;}
.section-label{font-size:12px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px;}
.search-history-item{font-size:13px;color:var(--text-2);padding:7px 0;border-bottom:1px solid var(--border);}
.trend-item{
  display:flex;align-items:baseline;gap:10px;
  padding:10px 0;border-bottom:1px solid var(--border);
}
.trend-rank{font-size:13px;font-weight:700;color:var(--text-3);width:18px;flex:0 0 auto;}
.trend-title{font-size:13.5px;font-weight:600;}
.trend-sub{font-size:11.5px;color:var(--text-3);margin-top:2px;}

.dm-list-item{
  display:flex;align-items:center;gap:11px;
  padding:11px 0 11px 14px;border-bottom:1px solid var(--border);
  position:relative;
}
.dm-list-name{font-size:13.5px;font-weight:600;}
.dm-list-tag{font-size:10.5px;color:var(--text-3);margin-left:6px;font-weight:500;}
.dm-list-preview{font-size:12.5px;color:var(--text-3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px;}
.dm-list-text{flex:1 1 auto;min-width:0;padding-right:54px;}
.dm-list-time{
  position:absolute;right:14px;top:13px;
  font-size:11.5px;color:var(--text-3);white-space:nowrap;
}

.detail-body{flex:1 1 auto;overflow-y:auto;padding:16px;}
.detail-text{font-size:14px;line-height:1.85;white-space:pre-wrap;}
.detail-comments{margin-top:18px;padding-top:14px;border-top:1px solid var(--border);}

.dm-feed{
  flex:1 1 auto;overflow-y:auto;padding:14px;
  display:flex;flex-direction:column;gap:9px;
}

/* ===================== X LIVE ===================== */
.x-screen{background:#000;}
.x-screen .app-header{background:rgba(0,0,0,0.0);border-bottom:1px solid rgba(255,255,255,0.12);}
.x-header .hdr-title,.x-header .hdr-btn{color:#f2f2f3;}
.x-header .icon-btn svg{stroke:#f2f2f3;}
.x-live-stage{
  flex:1 1 auto;position:relative;
  background:radial-gradient(circle at 50% 20%, #1c1c1d 0%, #060606 70%);
  overflow:hidden;
  display:flex;align-items:flex-end;
}
.x-live-topbar{
  position:absolute;top:14px;left:14px;right:14px;
  display:flex;align-items:center;justify-content:space-between;
  z-index:5;
}
.x-live-tag{
  background:#f2f2f3;color:#000;
  font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;
  letter-spacing:.04em;
}
.x-live-viewers{font-size:12px;color:#cfcfcf;font-weight:500;}
.x-scene-desc{
  position:relative;z-index:4;
  margin:0 16px 70px;
  background:rgba(20,20,21,0.72);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:16px;
  padding:16px;
  font-size:13.5px;color:#f0f0f1;line-height:1.7;
  backdrop-filter:blur(6px);
}
.x-danmaku-layer{
  position:absolute;inset:0;z-index:3;
  overflow:hidden;pointer-events:none;
}
.x-danmaku-item{
  position:absolute;
  white-space:nowrap;
  font-size:12.5px;
  color:#f2f2f3;
  background:rgba(40,40,41,0.55);
  padding:3px 10px;border-radius:11px;
  right:-10%;
  animation:danmakuFly linear forwards;
}
@keyframes danmakuFly{
  from{transform:translateX(0);}
  to{transform:translateX(-480px);}
}
.x-danmaku-toggle{
  position:absolute;left:16px;bottom:18px;z-index:8;
  width:34px;height:34px;border-radius:50%;
  background:rgba(40,40,41,0.7);
  border:1px solid rgba(255,255,255,0.14);
  display:flex;align-items:center;justify-content:center;
}
.x-danmaku-toggle svg{width:16px;height:16px;stroke:#f2f2f3;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.x-danmaku-panel{
  position:absolute;left:0;right:0;bottom:0;
  max-height:46%;
  background:rgba(15,15,16,0.92);
  border-top:1px solid rgba(255,255,255,0.12);
  border-radius:18px 18px 0 0;
  padding:14px 16px;
  overflow-y:auto;
  display:none;
  z-index:9;
  backdrop-filter:blur(10px);
}
.x-danmaku-panel.open{display:block;}
.x-danmaku-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.x-danmaku-panel-title{font-size:12px;color:#aeaeaf;font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
.x-danmaku-close{
  width:24px;height:24px;border-radius:50%;
  background:rgba(255,255,255,0.1);
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.x-danmaku-close:before, .x-danmaku-close:after{
  content:"";position:absolute;width:10px;height:1.4px;background:#f2f2f3;
}
.x-danmaku-close:before{transform:rotate(45deg);}
.x-danmaku-close:after{transform:rotate(-45deg);}
.x-danmaku-line{font-size:12.5px;color:#e6e6e7;margin-bottom:8px;line-height:1.4;}
.x-danmaku-line b{color:#f2f2f3;font-weight:600;margin-right:5px;}

/* ===================== PAYPAL ===================== */
.paypal-body{flex:1 1 auto;overflow-y:auto;padding:18px;}
.pp-card{
  background:linear-gradient(135deg, #1c1c1e 0%, #2c2c2e 100%);
  border:1px solid rgba(255,255,255,0.12);
  color:#ffffff;
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
  position:relative;
  overflow:hidden;
}
.pp-card:before{
  content:"";
  position:absolute;
  top:-30px;right:-30px;
  width:120px;height:120px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,0.06);
}
.pp-card:after{
  content:"";
  position:absolute;
  bottom:-50px;right:20px;
  width:160px;height:160px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,0.04);
}
.pp-card-top{position:relative;z-index:1;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8e8e93;margin-bottom:20px;}
.pp-card-number{position:relative;z-index:1;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:15px;letter-spacing:.1em;color:#c7c7cc;margin-bottom:16px;}
.pp-card-balance-label{position:relative;z-index:1;font-size:10px;color:#8e8e93;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.pp-card-balance{position:relative;z-index:1;font-size:26px;font-weight:300;color:#ffffff;margin-bottom:0;letter-spacing:-0.3px;}
.pp-card-holder{position:relative;z-index:1;font-size:12px;color:#c7c7cc;margin-top:16px;letter-spacing:.04em;text-transform:uppercase;}
.pp-tx-list .section-label{margin-top:4px;}
.pp-tx-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 0;border-bottom:1px solid var(--border);
}
.pp-tx-icon{
  width:40px;height:40px;border-radius:13px;
  background:var(--surface-2);border:1px solid var(--border);
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
}
.pp-tx-icon svg{width:18px;height:18px;stroke:var(--text-2);fill:none;stroke-width:1.4;}
.pp-tx-mid{flex:1 1 auto;min-width:0;}
.pp-tx-name{font-size:13.5px;font-weight:600;}
.pp-tx-date{font-size:11.5px;color:var(--text-3);margin-top:1px;}
.pp-tx-amt{font-size:14px;font-weight:700;flex:0 0 auto;}
.pp-tx-amt.neg{color:var(--text-2);font-weight:600;}

/* ===================== MAPS ===================== */
.maps-body{flex:1 1 auto;overflow-y:auto;padding:0;}
.maps-abstract{
  height:150px;
  background:var(--surface-2);
  border-bottom:1px solid var(--border);
  position:relative;overflow:hidden;
}
.maps-abstract svg{width:100%;height:100%;}
.maps-title{font-size:13px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;padding:16px 16px 8px;}
.maps-timeline{padding:0 16px 24px;}
.maps-stop{display:flex;gap:13px;padding:11px 0;}
.maps-stop-rail{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;width:10px;}
.maps-stop-dot{width:9px;height:9px;border-radius:50%;background:var(--text);margin-top:5px;}
.maps-stop-line{flex:1 1 auto;width:1px;background:var(--border);margin-top:4px;}
.maps-stop-body{flex:1 1 auto;padding-bottom:6px;}
.maps-stop-time{font-size:11.5px;color:var(--text-3);font-weight:600;}
.maps-stop-place{font-size:14px;font-weight:600;margin-top:2px;}
.maps-stop-desc{font-size:12.5px;color:var(--text-2);margin-top:3px;line-height:1.5;}

/* ===================== NOTES ===================== */
.notes-body{flex:1 1 auto;overflow-y:auto;padding:6px 16px;}
.note-item{padding:13px 0;border-bottom:1px solid var(--border);}
.note-title{font-size:14.5px;font-weight:600;}
.note-preview{font-size:12.5px;color:var(--text-2);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.note-date{font-size:11px;color:var(--text-3);margin-top:4px;}

/* ===================== SETTINGS ===================== */
.settings-body{flex:1 1 auto;overflow-y:auto;padding:18px 16px;}
.settings-group{margin-bottom:24px;}
.settings-row{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--surface);
  border:1px solid var(--border);
  padding:13px 15px;
  font-size:14px;
}
.settings-row:first-child{border-radius:13px 13px 0 0;}
.settings-row:last-child{border-radius:0 0 13px 13px;}
.settings-row + .settings-row{border-top:none;}
.settings-row.single{border-radius:13px;}
.settings-row-label{font-weight:500;}
.settings-row-value{color:var(--text-3);font-size:13px;}
.settings-chevron{color:var(--text-3);font-size:14px;}
.seg-control{display:flex;background:var(--surface-2);border-radius:9px;padding:2px;}
.seg-btn{
  flex:1 1 auto;text-align:center;padding:6px 12px;
  font-size:12.5px;font-weight:600;color:var(--text-2);border-radius:7px;
}
.seg-btn.active{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12);}

.field-label{font-size:12px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 8px;}
.field-label:first-child{margin-top:0;}
.field-input{
  width:100%;background:var(--surface);border:1px solid var(--border);
  border-radius:11px;padding:11px 13px;font-size:13.5px;color:var(--text);
}
.field-textarea{
  width:100%;min-height:110px;background:var(--surface);border:1px solid var(--border);
  border-radius:11px;padding:11px 13px;font-size:13.5px;color:var(--text);
  resize:vertical;line-height:1.6;font-family:inherit;
}
.field-hint{font-size:11.5px;color:var(--text-3);margin-top:6px;line-height:1.5;}
.field-row-check{display:flex;align-items:center;gap:9px;padding:4px 0;}
.checkbox{
  width:20px;height:20px;border-radius:6px;border:1.4px solid var(--border);
  flex:0 0 auto;position:relative;background:var(--surface);
}
.checkbox.checked{background:var(--accent);border-color:var(--accent);}
.checkbox.checked:after{
  content:"";position:absolute;left:6px;top:2px;width:5px;height:9px;
  border-right:2px solid var(--accent-text);border-bottom:2px solid var(--accent-text);
  transform:rotate(45deg);
}
.avatar-upload{
  width:64px;height:64px;border-radius:18px;background:var(--surface-2);
  border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--text-3);text-align:center;cursor:pointer;
  background-size:cover;background-position:center;
}
.avatar-row{display:flex;gap:14px;align-items:center;margin-bottom:4px;}
.btn-block{
  width:100%;padding:12px 0;border-radius:12px;
  background:var(--accent);color:var(--accent-text);
  font-size:14px;font-weight:600;text-align:center;margin-top:6px;
}
.btn-block.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
.btn-block.danger{background:var(--surface-2);color:var(--danger);border:1px solid var(--border);}

.model-list{
  max-height:260px;overflow-y:auto;
  border:1px solid var(--border);border-radius:11px;margin-top:8px;
}
.model-item{
  padding:11px 13px;font-size:13px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.model-item:last-child{border-bottom:none;}
.model-item.selected{background:var(--surface-2);font-weight:600;}

.char-card{
  display:flex;align-items:center;gap:12px;
  padding:13px;border:1px solid var(--border);border-radius:14px;margin-bottom:10px;
  background:var(--surface);
}
.char-card.active{border-color:var(--text);}
.char-card-avatars{display:flex;flex:0 0 auto;}
.char-card-avatars .ig-avatar:nth-child(2){margin-left:-12px;}
.char-card-mid{flex:1 1 auto;min-width:0;}
.char-card-title{font-size:14px;font-weight:600;}
.char-card-sub{font-size:12px;color:var(--text-3);margin-top:2px;}
.char-card-edit{font-size:12px;color:var(--text-2);padding:6px 10px;}

.icon-row{
  display:flex;align-items:center;gap:13px;
  padding:12px 0;border-bottom:1px solid var(--border);
}
.icon-row-name{flex:1 1 auto;font-size:13.5px;font-weight:500;}
.icon-row-edit{font-size:12px;color:var(--text-2);padding:5px 9px;}

.empty-state{
  text-align:center;color:var(--text-3);font-size:13px;padding:60px 20px;line-height:1.7;
}

.toast{
  display:none; /* replaced by in-phone toast */
  position:fixed;bottom:40px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:rgba(30,30,31,0.94);color:#f2f2f3;
  font-size:13px;padding:10px 18px;border-radius:12px;
  opacity:0;pointer-events:none;
  transition:opacity .2s, transform .2s;
  z-index:9999;
  max-width:80vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@keyframes ellipsis{0%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}

.sheet-overlay{
  position:absolute;inset:0;z-index:200;
  background:rgba(0,0,0,0.32);
  display:none;
  align-items:flex-end;justify-content:center;
}
.sheet-overlay.open{display:flex;}
.action-sheet{
  width:100%;
  background:var(--surface);
  border-radius:18px 18px 0 0;
  padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 10px);
  animation:sheetUp .18s ease;
}
@keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet-title{
  text-align:center;font-size:12px;color:var(--text-3);
  padding:12px 0 8px;border-bottom:1px solid var(--border);
}
.sheet-option{
  display:block;width:100%;text-align:center;
  padding:14px 0;font-size:15px;color:var(--text);
  border-bottom:1px solid var(--border);
}
.sheet-option:last-of-type{border-bottom:none;}
.sheet-cancel{
  display:block;width:100%;text-align:center;
  padding:14px 0;margin-top:8px;
  font-size:15px;font-weight:600;color:var(--text);
  background:var(--surface-2);border-radius:13px;
}

.prompt-overlay{
  position:absolute;inset:0;z-index:210;
  background:rgba(0,0,0,0.32);
  display:none;align-items:center;justify-content:center;
  padding:30px;
}
.prompt-overlay.open{display:flex;}
.prompt-card{
  width:100%;max-width:300px;
  background:var(--surface);border-radius:16px;
  padding:18px;
  animation:sheetUp .16s ease;
}
.prompt-card-title{font-size:14px;font-weight:600;margin-bottom:10px;text-align:center;}
.prompt-card textarea{
  width:100%;min-height:80px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:10px;
  padding:10px;font-size:13.5px;color:var(--text);
  font-family:inherit;resize:vertical;
}
.prompt-card-actions{display:flex;gap:8px;margin-top:12px;}
.prompt-card-actions button{
  flex:1 1 auto;padding:10px 0;border-radius:10px;font-size:13.5px;font-weight:600;
}
.prompt-card-actions .pc-cancel{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
.prompt-card-actions .pc-ok{background:var(--accent);color:var(--accent-text);}

/* ===== Inline selection mode (circles from left) ===== */
/* When .sel-mode is active on a feed container, messages slide right to reveal circle */
.sel-mode-bar{
  display:none;
  position:absolute;top:46px;left:0;right:0;
  z-index:50;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:8px 12px;
  flex-direction:column;
  gap:6px;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  box-shadow:0 2px 12px rgba(0,0,0,0.12);
}
.sel-mode-bar.open{display:flex;}
.sel-mode-actions{display:flex;gap:8px;align-items:center;}
.sel-mode-count{flex:1;font-size:13px;color:var(--text-2);}
.sel-mode-edit{font-size:13px;font-weight:600;color:var(--text);padding:7px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);}
.sel-mode-recall{font-size:13px;font-weight:600;color:#ff9f0a;padding:7px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);}
.sel-mode-delete{font-size:13px;font-weight:600;color:#ff3b30;padding:7px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);}
.sel-mode-cancel{font-size:13px;font-weight:500;color:var(--text-2);padding:7px 10px;border-radius:10px;}

/* bubble-row and dm-feed rows get a circle on left in sel-mode */
.feed-selectable{position:relative;}
.sel-circle{
  width:22px;height:22px;border-radius:50%;
  border:1.5px solid var(--border);
  background:var(--surface);
  flex:0 0 auto;
  display:none; /* shown via .in-sel-mode */
  align-items:center;justify-content:center;
  cursor:pointer;
  transition:transform .12s ease;
  margin-right:6px;
}
.sel-circle.on{background:var(--accent);border-color:var(--accent);}
.sel-circle.on:after{
  content:"";display:block;
  width:5px;height:9px;
  border-right:2px solid var(--accent-text);
  border-bottom:2px solid var(--accent-text);
  transform:rotate(45deg) translate(-1px,-1px);
}
.in-sel-mode .sel-circle{display:flex;}
/* Messages stay in place, circle appears to the left */
.in-sel-mode .bubble-row{
  transform:none !important;
  transition:none !important;
}

/* Keep old sel-overlay for posts/DM-list/search-history (not inline chat) */
.sel-overlay{
  position:absolute;inset:0;z-index:300;
  background:rgba(0,0,0,0.38);
  display:none;flex-direction:column;
}
.sel-overlay.open{display:flex;}
.sel-topbar{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  font-size:14px;font-weight:600;
}
.sel-cancel{color:var(--text-2);font-size:14px;padding:4px 8px;}
.sel-act-row{display:flex;gap:8px;}
.sel-edit-btn{color:var(--text);font-size:13.5px;padding:6px 12px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);}
.sel-delete-btn{color:var(--danger);font-size:13.5px;padding:6px 12px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);}
.sel-list{flex:1 1 auto;overflow-y:auto;background:var(--bg);}
.sel-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 16px;
  border-bottom:1px solid var(--border);
  background:var(--bg);
  user-select:none;
}
.sel-item.checked{background:var(--surface-2);}
.sel-check{
  width:22px;height:22px;border-radius:50%;
  border:1.5px solid var(--border);
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface);
}
.sel-check.on{background:var(--accent);border-color:var(--accent);}
.sel-check.on:after{
  content:"";width:6px;height:10px;
  border-right:2px solid var(--accent-text);
  border-bottom:2px solid var(--accent-text);
  transform:rotate(45deg) translateY(-1px);
}
.sel-content{flex:1 1 auto;min-width:0;}
.sel-item-meta{font-size:11.5px;color:var(--text-3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

@media (max-width:420px){
  body{padding:0;}
  #phone{width:100vw;height:100vh;border-radius:0;border:none;}
}

/* ===== iOS-style toggle switch ===== */
.ios-toggle{
  width:51px;height:31px;border-radius:16px;
  background:var(--surface-3);
  position:relative;cursor:pointer;
  transition:background .2s ease;
  flex:0 0 auto;
  border:1px solid var(--border);
}
.ios-toggle:after{
  content:'';position:absolute;
  top:2px;left:2px;
  width:25px;height:25px;border-radius:50%;
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.25);
  transition:transform .2s ease;
}
.ios-toggle.on{background:#34c759;border-color:#34c759;}
.ios-toggle.on:after{transform:translateX(20px);}

/* ===== Chat/DM context menu (long-press) — fancy popup above message ===== */
.msg-ctx-menu{
  position:absolute;
  z-index:500;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:0 8px 32px rgba(0,0,0,0.22);
  display:flex;
  gap:0;
  overflow:hidden;
  animation:ctxPop .14s ease;
}
@keyframes ctxPop{from{opacity:0;transform:scale(.85);}to{opacity:1;transform:scale(1);}}
.msg-ctx-btn{
  padding:11px 18px;
  font-size:13.5px;font-weight:500;
  color:var(--text);
  border-right:1px solid var(--border);
  white-space:nowrap;
}
.msg-ctx-btn:last-child{border-right:none;}
.msg-ctx-btn.danger{color:#ff3b30;}
.msg-ctx-btn:active{background:var(--surface-2);}

/* ===== Phone size slider ===== */
#phoneSizeSliderWrap{
  margin-top:18px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
#phoneSizeSlider{
  -webkit-appearance:none;appearance:none;
  width:260px;height:4px;border-radius:2px;
  background:var(--surface-3);outline:none;cursor:pointer;
}
#phoneSizeSlider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:20px;height:20px;border-radius:50%;
  background:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,0.18);
  cursor:pointer;
}
#phoneSizeSlider::-moz-range-thumb{
  width:20px;height:20px;border-radius:50%;
  background:var(--accent);border:none;
  box-shadow:0 1px 4px rgba(0,0,0,0.18);cursor:pointer;
}
#phoneSizeLabel{font-size:12px;color:var(--text-3);}

/* ===== Bubble color swatch picker ===== */
.color-swatch{
  width:28px;height:28px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;transition:transform .12s ease;
  position:relative;flex:0 0 auto;
}
.color-swatch.active{border-color:var(--text);transform:scale(1.15);}
.color-swatch:active{transform:scale(.92);}
.color-swatches{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0;}
.color-swatch-custom{
  width:28px;height:28px;border-radius:50%;
  overflow:hidden;position:relative;
  border:2px solid var(--border) !important;
}
.color-swatch-custom input[type="color"]{
  opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer;
}

/* ===== Avatar display in chat ===== */
.chat-avatar{
  width:var(--chat-avatar-size,32px);height:var(--chat-avatar-size,32px);
  border-radius:50%;
  background:var(--surface-3);
  background-size:cover;background-position:center;
  flex:0 0 var(--chat-avatar-size,32px);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;color:var(--text-2);
  border:1px solid var(--border);
}
/* Square avatar shape option */
#phone[data-avatar-shape="square"] .chat-avatar{
  border-radius:8px;
}
/* Removed per-row gap overrides — bubble-row handles gap globally */

/* ===== In-phone notification banner ===== */
#msg-notification{
  position:absolute;
  top:52px;left:8px;right:8px;
  z-index:9200;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:10px 14px;
  display:none;
  align-items:center;gap:10px;
  box-shadow:0 4px 20px rgba(0,0,0,0.22);
  animation:notifSlideIn .22s cubic-bezier(.34,1.56,.64,1);
  cursor:pointer;
}
@keyframes notifSlideIn{from{opacity:0;transform:translateY(-16px);}to{opacity:1;transform:translateY(0);}}
#msg-notification.show{display:flex;}
.notif-icon{
  width:36px;height:36px;border-radius:10px;
  background:var(--accent);
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
}
.notif-icon svg{width:18px;height:18px;stroke:var(--accent-text);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.notif-content{flex:1;min-width:0;}
.notif-app{font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.04em;}
.notif-text{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.notif-time{font-size:11px;color:var(--text-3);flex:0 0 auto;}

/* ===== Chat background / wallpaper ===== */
.dm-feed.has-chat-bg, #userChatFeed.has-chat-bg{
  background-size:cover;
  background-position:center;
}
.chat-bg-overlay{
  position:absolute;inset:0;pointer-events:none;z-index:0;
}
#userChatFeed.has-chat-bg .bubble-row,
#userChatFeed.has-chat-bg .chat-time-divider,
#userChatFeed.has-chat-bg .recalled-msg{
  position:relative;z-index:1;
}

/* ===== Chat timestamp divider ===== */
.chat-time-divider{
  text-align:center;
  font-size:11px;color:var(--text-3);
  margin:10px 0 6px;
}
.chat-time-divider span{
  padding:0 4px;
}

/* ===== Transfer message bubble — WeChat style horizontal ===== */
.transfer-bubble{
  display:flex;
  align-items:center;
  gap:16px;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px 20px;
  min-width:210px;
  max-width:260px;
}
.transfer-bubble-icon{
  display:flex;flex-direction:column;align-items:center;gap:5px;flex:0 0 auto;
}
.transfer-bubble-icon svg{width:32px;height:32px;stroke:#8a8a8e;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;}
.transfer-bubble-icon span{font-size:11px;color:#8a8a8e;letter-spacing:.03em;}
.transfer-bubble-main{flex:1 1 auto;min-width:0;}
.transfer-bubble-amount{font-size:24px;font-weight:700;color:#e8e8ea;letter-spacing:.02em;}
#phone[data-theme="light"] .transfer-bubble-amount{color:#1a1a1b;}
.transfer-bubble-note{font-size:13px;color:#8a8a8e;margin-top:3px;}

/* ===== Recalled message — same style as time divider ===== */
.recalled-msg{
  text-align:center;
  font-size:11px;
  color:var(--text-3);
  padding:3px 0 6px;
  font-style:normal;
  letter-spacing:.01em;
}

/* ===== Chat list (Instagram DM style) ===== */
.chat-list-entry{
  display:flex;align-items:center;gap:12px;
  padding:8px 14px;border-bottom:1px solid var(--border);
  cursor:pointer;
  position:relative;
}
.chat-list-entry:active{background:var(--surface-2);}
.chat-list-entry .ig-avatar{
  width:44px;height:44px;flex:0 0 44px;
  font-size:16px;border-radius:12px;
}
.chat-list-entry .dm-list-text{
  flex:1 1 auto;min-width:0;padding-right:52px;
}
.chat-list-entry .dm-list-name{font-size:14px;font-weight:600;line-height:1.3;}
.chat-list-entry .dm-list-preview{
  font-size:12.5px;color:var(--text-3);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.chat-list-entry .dm-list-time{
  position:absolute;right:14px;top:11px;
  font-size:11.5px;color:var(--text-3);white-space:nowrap;
}

/* ===== Chat bubble scale ===== */
.bubble-feed,.dm-feed{--bubble-scale:1;}
.bubble,.transfer-bubble{
  transform-origin:left center;
}
.bubble-row.sent .bubble,.bubble-row.sent .transfer-bubble{
  transform-origin:right center;
}

/* ===== Add contact button in DM header ===== */
.three-dot-btn{
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  padding:0;position:relative;z-index:1;
}
.three-dot-btn svg{width:18px;height:18px;stroke:var(--text-2);fill:none;stroke-width:2;stroke-linecap:round;}

/* ===== Dropdown menu ===== */
.dropdown-menu{
  position:absolute;top:44px;right:8px;
  min-width:180px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:13px;
  box-shadow:0 8px 24px rgba(0,0,0,0.18);
  z-index:600;
  overflow:hidden;
  animation:ctxPop .14s ease;
}
.dropdown-item{
  display:block;width:100%;text-align:left;
  padding:12px 16px;
  font-size:13.5px;color:var(--text);
  border-bottom:1px solid var(--border);
}
.dropdown-item:last-child{border-bottom:none;}
.dropdown-item:active{background:var(--surface-2);}
.dropdown-divider{height:1px;background:var(--border);}

/* ===== Refresh button spin when loading ===== */
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.refresh-btn.spinning{
  position:relative;
}
.refresh-btn.spinning svg{
  animation:spin .8s linear infinite;
  transform-origin:50% 50%;
  transform-box:fill-box;
  display:block;
  will-change:transform;
}

/* ===== In-phone generating indicator + system toast — unified style ===== */
@keyframes dot-pulse{0%,80%,100%{opacity:0.2}40%{opacity:1}}
.phone-pill{
  display:none;
  position:absolute;
  bottom:96px;
  left:50%;
  transform:translateX(-50%) translateY(6px);
  z-index:9100;
  background:rgba(36,36,38,0.93);
  color:#e8e8ea;
  font-size:13px;
  font-weight:500;
  letter-spacing:.02em;
  padding:9px 18px;
  border-radius:14px;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,0.10);
  white-space:nowrap;
  pointer-events:none;
  box-shadow:0 4px 20px rgba(0,0,0,0.30);
  max-width:82%;
  text-align:center;
  word-break:break-word;
  white-space:normal;
}
.phone-pill.visible{
  display:block;
  animation:pill-in .18s cubic-bezier(.34,1.3,.64,1) forwards;
}
@keyframes pill-in{from{opacity:0;transform:translateX(-50%) translateY(12px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
#phone[data-theme="light"] .phone-pill{
  background:rgba(245,245,247,0.94);
  color:#1a1a1b;
  border:1px solid rgba(0,0,0,0.09);
  box-shadow:0 4px 20px rgba(0,0,0,0.12);
}
.pill-dots{display:inline-flex;gap:3px;align-items:center;margin-left:4px;vertical-align:middle;}
.pill-dot{
  width:4px;height:4px;border-radius:50%;
  background:currentColor;opacity:.25;
  animation:dot-pulse 1.4s ease-in-out infinite;
}
.pill-dot:nth-child(2){animation-delay:.2s;}
.pill-dot:nth-child(3){animation-delay:.4s;}

/* Legacy IDs — now both use .phone-pill */
#phone-gen-indicator{display:none !important;}
#phone-sys-toast{display:none !important;}

#gen-indicator{

}

function t(key){
  const lang = state.settings.language || 'zh';
  return (I18N[lang] && I18N[lang][key]) || I18N.zh[key] || key;
}

/* ===================================================================
   STATE
=================================================================== */
const STORAGE_KEY = 'idolPhoneAppState_v1';

function defaultState(){
  return {
    settings:{
      language:'zh',
      theme:'dark',
      apiUrl:'',
      apiKey:'',
      model:'',
      modelList:[],
      customIcons:{}, // appKey -> {name, icon(dataURL)}
      wallpaper:'',
      fitScreen:false,
      phoneScale:100,
      chatShowSentAvatar:true,
      chatShowRecvAvatar:true,
      avatarShape:'circle',
      avatarSize:32,
      bubbleColors:{sent:'', recv:''},
      chatColors:{sent:'', recv:''},
      dmColors:{sent:'', recv:''}
    },
    characters:[],
    currentCharacterId:null,
    currentOwner:'idol' // 'idol' | 'user'
  };
}

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const base = defaultState();
    return Object.assign(base, parsed, {
      settings:Object.assign(base.settings, parsed.settings||{}),
    });
  }catch(e){
    console.warn('loadState failed', e);
    return defaultState();
  }
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.warn('saveState failed', e);
    showToast(t('toast.genFailed')+': '+(e && e.message ? e.message : String(e)));
  }
}

function getCurrentChar(){
  return state.characters.find(c=>c.id===state.currentCharacterId) || null;
}

function ensurePhoneData(ch){
  if(!ch.phoneData) ch.phoneData = {};
  const pd = ch.phoneData;
  if(!pd.bubble) pd.bubble = {rounds:[]};
  if(!pd.instagram) pd.instagram = {posts:[], searchHistory:[], trending:[], dms:[], topicCache:{}, searchCache:{}};
  if(!pd.instagramAlt) pd.instagramAlt = {posts:[], searchHistory:[], dms:[], searchCache:{}, topicCache:{}};

function showActionSheet(title, options, callback){
  const overlay = document.getElementById('sheetOverlay');
  const sheet = document.getElementById('actionSheet');
  let html = '';
  if(title) html += '<div class="sheet-title">'+escapeHtml(title)+'</div>';

/* Resize an image file to a small square dataURL to keep localStorage light */
function fileToResizedDataUrl(file, maxSize){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const size = maxSize||240;
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        const scale = Math.min(1, size/Math.max(w,h));
        canvas.width = Math.round(w*scale);
        canvas.height = Math.round(h*scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.82));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function normalizeBaseUrl(url){

async function fetchModelList(){
  const base = normalizeBaseUrl(state.settings.apiUrl);
  if(!base){ showToast(t('toast.apiMissing')); return; }

    else if(Array.isArray(data.models)) list = data.models.map(m=>m.id||m.name).filter(Boolean);
    else if(Array.isArray(data)) list = data.map(m=>m.id||m.name||m).filter(Boolean);
    if(!list.length) throw new Error('empty');
    state.settings.modelList = list;
    if(!state.settings.model) state.settings.model = list[0];

  }catch(err){
    console.warn('fetchModelList failed', err);
    showToast(t('toast.modelsFailed'));
  }
  renderSettingsApi();
}

/* Strip ```json fences etc, then parse. Returns null on failure. */
function safeParseJSON(text){
  if(!text) return null;
  let s = text.trim();
  s = s.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  const firstBrace = s.search(/[\[{]/);
  if(firstBrace>0) s = s.slice(firstBrace);
  try{ return JSON.parse(s); }catch(e){}
  // try trimming trailing garbage after last closing bracket
  const lastBrace = Math.max(s.lastIndexOf('}'), s.lastIndexOf(']'));
  if(lastBrace>-1){
    try{ return JSON.parse(s.slice(0,lastBrace+1)); }catch(e){}
  }
  return null;
}

/* Core completion call. Returns raw text content or throws. */
async function callAPI(systemPrompt, userPrompt){
  const base = normalizeBaseUrl(state.settings.apiUrl);
  if(!base || !state.settings.model){
    throw new Error('NO_API_CONFIG');
  }
  const controller = new AbortController();
  const timeoutId = setTimeout(()=>controller.abort(), 90000);
  let res;
  try{
    res = await fetch(base+'/chat/completions', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+(state.settings.apiKey||'')
      },
      body: JSON.stringify({
        model: state.settings.model,
        temperature: 0.95,
        max_tokens: 4000,
        messages:[
          {role:'system', content: systemPrompt},
          {role:'user', content: userPrompt}
        ]
      }),
      signal: controller.signal
    });
  }catch(err){
    if(err && err.name==='AbortError') throw new Error('Request timed out');
    throw new Error('Network error (check URL / CORS / connection): '+(err && err.message ? err.message : err));
  }finally{
    clearTimeout(timeoutId);
  }
  if(!res.ok){
    let bodyText = '';
    try{ bodyText = (await res.text()).slice(0,200); }catch(e){}
    throw new Error('HTTP '+res.status+(bodyText? ' — '+bodyText : ''));
  }
  const data = await res.json();
  const msg = data && data.choices && data.choices[0] && data.choices[0].message;
  const content = (msg && msg.content) || (data && data.choices && data.choices[0] && data.choices[0].text);
  if(!content) throw new Error('Empty response from API');
  return content;
}

/* Generate structured JSON content. Returns parsed object on success, null on any failure. Never throws. */
async function generateJSON(systemPrompt, userPrompt){
  const full = systemPrompt + '\n\n严格只输出合法 JSON，不要输出任何解释文字、不要使用 Markdown 代码块标记。';
  try {
    const raw = await callAPI(full, userPrompt);
    const parsed = safeParseJSON(raw);
    return parsed; // null if unparseable, object if ok
  } catch(e) {
    console.warn('generateJSON failed:', e);
    return null;
  }
}

  // Notes 备忘录摘要
  try{
    const pd = ensurePhoneData(ch);
    if(pd.notes && pd.notes.items && pd.notes.items.length){
      const recentNotes = pd.notes.items.slice(-2);
      const noteLines = recentNotes.map(n=>n.title+'：'+(n.body||'').slice(0,60)).join('\n');
      if(noteLines) memoryParts.push('\n【idol的备忘录摘要（作为idol状态参考）】\n'+noteLines);
    }
  }catch(e){}

  // 角色记忆条目
  try{
    const entries = ch.memoryEntries || [];
    if(entries.length){
      const memLines = entries.map(e=>(e.title?'['+e.title+'] ':'')+e.content).filter(Boolean).join('\n');
      if(memLines) memoryParts.push('\n【角色记忆（重要事件与背景，生成内容时请参考并保持一致）】\n'+memLines);
    }
  }catch(e){}

  return [
    '你是一个手机模拟应用的内容生成引擎，为虚构角色生成手机里各软件的内容。',
    '【idol 人设】姓名：'+(ch.idolName||'未命名')+'；简介：'+(ch.idolBio||'无'),
    '【用户人设】姓名：'+(ch.userName||'未命名')+'；简介：'+(ch.userBio||'无'),
    '【关系设定】'+relation,
    wb ? ('【世界书 / 生成要求】\n'+wb) : '【世界书】无特殊设定。',
    memoryParts.join(''),
    '【语言要求】除非是无法翻译的专有名词、品牌名或英文缩写，全部内容必须使用简体中文输出。',
    '【内容要求】内容真实自然、有生活气息，避免空洞和重复，不要使用表情符号(emoji)。',
    extra || ''
  ].join('\n');
}

async function bubbleGenerateFanReplies(ch, idolText){
  const sys = buildBaseSystemPrompt(ch, '现在请为idol刚刚发出的一条消息，生成来自不同粉丝的回复。');
  const usr = 'idol刚刚发送的内容是：「'+idolText+'」\n请生成恰好8条来自不同粉丝的回复评论，粉丝姓名（网名/ID）各不相同且口语化。\n输出 JSON 格式：{"replies":[{"name":"粉丝昵称","text":"回复内容"}, ... 共8条]}';
  const data = await generateJSON(sys, usr);
  if(data && Array.isArray(data.replies)) return data.replies.slice(0,8);
  throw new Error('Could not parse a valid reply list from the API response');
}

async function refreshBubble(){
  const ch = getCurrentChar();
  if(!ch){ showToast(t('toast.charMissing')); return; }
  if(!normalizeBaseUrl(state.settings.apiUrl) || !state.settings.model){ showToast(t('toast.apiMissing')); return; }
  const pd = ensurePhoneData(ch);
  showGenerating();
  try{
    const sys = buildBaseSystemPrompt(ch, '请生成idol过去在 Bubble（粉丝互动泡泡软件）里发布过的历史消息记录。');
    const usr = '请生成 3 到 4 条idol过去发送给粉丝的消息（可以是文字感想，也可以是配文照片）。\n输出 JSON：{"messages":[{"photo":false,"text":"消息内容"}, ...]}\n如果某条是配文照片，"photo"设为true，"text"则填写这张照片的文字描述（因为这是纯文字模拟，照片用文字描述代替）。\n每条消息生成后，紧接着各生成8条来自不同粉丝、昵称各异、口语化自然的回复评论，放在对应的"replies"字段里：{"messages":[{"photo":false,"text":"...","replies":[{"name":"...","text":"..."},...共8条]}, ...]}';
    const data = await generateJSON(sys, usr);
    if(data && Array.isArray(data.messages) && data.messages.length){
      const newRounds = data.messages.map(m=>({
        id:uid('r'),
        photo: !!m.photo,
        text: m.text||'',
        replies: Array.isArray(m.replies) ? m.replies.slice(0,8) : [],
        expanded:false
      }));
      // Keep existing rounds, stream new ones in
      const existingCount = pd.bubble.rounds.length;
      pd.bubble.rounds = pd.bubble.rounds.concat(newRounds);
      saveState();
      // Render existing first
      renderBubble();
      // Then stream in new rounds one by one by re-appending their HTML
      const feed = document.getElementById('bubbleFeed');
      // Remove empty-state if present
      const es = feed.querySelector('.empty-state');
      if(es) es.remove();
      // Temporarily remove new rounds from DOM so we can stream them
      const allRendered = Array.from(feed.querySelectorAll('.bubble-round'));
      // Remove newly rendered rounds (they were added by renderBubble)
      allRendered.slice(existingCount).forEach(el=>el.remove());
      // Stream them back in one by one
      let i=0;
      function streamNextRound(){
        if(i>=newRounds.length) return;
        const round = newRounds[i++];
        const div = document.createElement('div');
        div.innerHTML = roundHtml(round);
        const el = div.firstChild;
        feed.appendChild(el);
        // bind expand toggle for this round
        el.querySelectorAll('.expand-toggle').forEach(btn=>{
          btn.addEventListener('click', ()=>{
            const r = pd.bubble.rounds.find(x=>x.id===btn.getAttribute('data-round'));
            if(r){ r.expanded=!r.expanded; renderBubble(); }
          });
        });
        feed.scrollTop = feed.scrollHeight;
        setTimeout(streamNextRound, 900);
      }
      streamNextRound();
    } else {
      throw new Error('Could not parse the message list from the API response');
    }
  }catch(err){
    console.warn(err);
    showToast(t('toast.genFailed')+': '+(err && err.message ? err.message : String(err)));
    renderBubble();
  }finally{
    hideGenerating();
  }
}

async function sendBubbleMessage(text, isPhoto){
  const ch = getCurrentChar();
  if(!ch){ showToast(t('toast.charMissing')); return; }
  const pd = ensurePhoneData(ch);
  const round = {id:uid('r'), photo:!!isPhoto, text:text, replies:[], expanded:true};
  pd.bubble.rounds.push(round);
  saveState();
  renderBubble();

}

/* Generic text-input modal. callback(text) only fires if confirmed with non-empty text. */
function showPromptModal(title, placeholder, callback){
  const overlay = document.getElementById('promptOverlay');
  const card = document.getElementById('promptCard');
  card.innerHTML =
    '<div class="prompt-card-title">'+escapeHtml(title)+'</div>'
    + '<textarea id="promptCardInput" placeholder="'+escapeHtml(placeholder||'')+'"></textarea>'
    + '<div class="prompt-card-actions">'
    + '<button class="pc-cancel" data-v="__cancel">'+escapeHtml(t('btn.cancel'))+'</button>'
    + '<button class="pc-ok" data-v="__ok">'+escapeHtml(t('btn.send'))+'</button>'
    + '</div>';
  overlay.classList.add('open');
  const input = document.getElementById('promptCardInput');
  input.focus();
  function close(){ overlay.classList.remove('open'); overlay.removeEventListener('click', onClick); }
  function onClick(e){
    const btn = e.target.closest('[data-v]');
    if(!btn){ if(e.target===overlay) close(); return; }
    const v = btn.getAttribute('data-v');
    const val = input.value.trim();
    close();
    if(v==='__ok' && val) callback(val);
  }
  overlay.addEventListener('click', onClick);
}

          ()=>pd.dms.map((d,i)=>({id:String(i), label:d.name, sublabel:(d.messages[d.messages.length-1]||{}).text||''})),

  showGenerating();
  const errors = [];
  const tasks = section==='all' ? ['posts','search','trending','dm'] : [section];
  // Run all tasks first, render only once everything is done
  for(const task of tasks){
    try{
      if(task==='posts') await igRefreshPosts(ch, pd);

  hideGenerating();

}

let currentTopicCtx = null; // {scope, kind, idx}

async function openTopicDetail(scope, kind, idx){
  const ch = getCurrentChar();
  const pd = resolveIgPd(scope);
  const list = kind==='search' ? pd.searchHistory : pd.trending;
  // Ensure searchCache and topicCache exist
  if(!pd.searchCache) pd.searchCache = {};
  if(!pd.topicCache) pd.topicCache = {};
  const cache = kind==='search' ? pd.searchCache : pd.topicCache;
  const rawTopic = list[idx];
  if(!rawTopic) return;
  // Handle both string items and {title, heat} objects
  const topic = typeof rawTopic === 'string' ? {title: rawTopic} : rawTopic;
  currentTopicCtx = {scope, kind, idx};
  goTo('screen-ig-topic');
  document.getElementById('igTopicTitle').textContent = topic.title;
  const body = document.getElementById('igTopicBody');
  const cacheKey = topic.title;
  if(cache[cacheKey]){
    renderTopicBody(cache[cacheKey]);
    return;
  }
  body.innerHTML = '<div class="loading-row">'+t('toast.generating')+'</div>';
  if(!normalizeBaseUrl(state.settings.apiUrl) || !state.settings.model){ showToast(t('toast.apiMissing')); body.innerHTML=''; return; }
  showGenerating();
  try{
    const sys = buildBaseSystemPrompt(ch, '请为指定的话题生成对应的文章内容与网友评论。');
    const usr = (kind==='search' ? '搜索词' : '热搜话题')+'：「'+topic.title+'」\n请生成与这个词条相关的内容，包含：发帖人昵称、发帖时间、正文内容（约400字，可以是新闻报道、爆料、自媒体解读或网友长文等），以及3到5条网友评论。\n输出 JSON：{"poster":"发帖人昵称","postTime":"如 2小时前","article":"约400字正文","comments":[{"name":"昵称","text":"评论"}]}';
    const data = await generateJSON(sys, usr);
    if(data && data.article){
      cache[cacheKey] = data;
      saveState();
      renderTopicBody(data);
    } else {
      throw new Error('Could not parse article content from the API response');
    }
  }catch(err){
    console.warn(err);
    showToast(t('toast.genFailed')+': '+(err && err.message ? err.message : String(err)));
    body.innerHTML = '';
  }finally{
    hideGenerating();
  }
}

function renderTopicBody(data){
  const body = document.getElementById('igTopicBody');
  let html = '';
  // Post header (poster + time)
  if(data.poster || data.postTime){
    html += '<div class="ig-post-head" style="margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border);">'
      + '<div class="ig-avatar" style="background:var(--surface-3);"></div>'
      + '<div><div class="ig-post-name">'+escapeHtml(data.poster||'匿名')+'</div>'
      + '<div class="ig-post-time">'+escapeHtml(data.postTime||'')+'</div></div></div>';
  }
  html += '<div class="detail-text">'+escapeHtml(data.article||'')+'</div>';
  if(Array.isArray(data.comments) && data.comments.length){
    html += '<div class="detail-comments"><div class="section-label">'+t('label.comments')+'</div>';
    data.comments.forEach(c=>{
      html += '<div class="ig-comment"><b>'+escapeHtml(c.name)+'</b>'+escapeHtml(c.text)+'</div>';
    });
    html += '</div>';
  }
  body.innerHTML = html;
}

      feed.innerHTML = renderMsgFeedHtml(existingMsgs, null, false);
      streamMessages(feed, newMsgs, 1100);
    } else if(data && data.text){
      // fallback single message
      const m = {from:'them',text:data.text,id:uid('dm'),ts:Date.now()};
      dm.messages.push(m);
      saveState();
      showMsgNotification('DM', dm.name, m.text);
      renderDmFeed();

    console.warn(err);
    showToast(t('toast.genFailed')+': '+(err && err.message ? err.message : String(err)));
  }finally{
    hidePhoneGenerating();
  }
});

function startDanmaku(list){
  stopDanmaku();
  if(!list || !list.length) return;
  const layer = document.getElementById('xDanmakuLayer');
  let i = 0;
  danmakuTimer = setInterval(()=>{
    const item = list[i % list.length];
    i++;
    const el = document.createElement('div');
    el.className = 'x-danmaku-item';
    el.textContent = item.name+'： '+item.text;
    el.style.top = randInt(8, 70)+'%';
    const dur = randInt(7,11);
    el.style.animationDuration = dur+'s';
    layer.appendChild(el);
    setTimeout(()=>{ el.remove(); }, dur*1000+200);
  }, 900);
}
function stopDanmaku(){
  if(danmakuTimer){ clearInterval(danmakuTimer); danmakuTimer=null; }

function recentUserChatContext(ch, limit){
  const pd = ensurePhoneData(ch).userChat;
  const msgs = pd.messages.slice(-1*(limit||10));
  if(!msgs.length) return '';
  const lines = msgs.map(m=>{
    const speaker = m.from==='me' ? (ch.userName||'用户') : (ch.idolName||'idol');
    if(m.recalled) return speaker+'：[撤回了一条消息：「'+m.recalledText+'」]';
    return speaker+'：'+m.text;
  }).join('\n');
  return '\n【用户与idol最近的私下聊天记录，生成内容时请参考并保持一致】\n'+lines;
}

function addUserChatMessage(text){
  const ch = getCurrentChar();

  renderUserChatFeed();
  renderChatList();
}

async function triggerIdolChatReply(){
  const ch = getCurrentChar();
  if(!ch){ showToast(t('toast.charMissing')); return; }
  const pd = ensurePhoneData(ch).userChat;
  if(!pd.messages.length) return;
  if(!normalizeBaseUrl(state.settings.apiUrl) || !state.settings.model){ showToast(t('toast.apiMissing')); return; }
  showPhoneGenerating();
  try{
    const sys = buildBaseSystemPrompt(ch,
      '现在请扮演idol本人，回复用户刚刚发来的私下消息。这是两人之间最私密的聊天频道。\n'
      +'【回复要求】根据idol人设与当前对话内容，真实地模拟idol的聊天风格：\n'
      +'- 回复条数完全由对话节奏和idol人设决定，像真实聊天一样自然（可以是一句也可以是十几句）\n'
      +'- 可以有短促的感叹（如"哈哈"、"啊"、"嗯"）作为独立消息\n'
      +'- 可以分多次说完一件事，像真实聊天一样断句\n'
      +'- 语气、用词、聊天节奏必须完全符合idol人设与两人的关系设定\n'
      +'- 消息之间要有逻辑连贯性，不要重复同一意思\n'
      +'- 根据剧情需要，你也可以选择撤回idol之前发送过的某条消息，在recall_ids字段填写要撤回的消息id（如果不需要撤回则填空数组）'
    );
    const history = pd.messages.map(m=>{
      const speaker = m.from==='me' ? (ch.userName||'用户') : (ch.idolName||'idol');
      if(m.recalled) return speaker+'[id:'+m.id+']：[已撤回:「'+m.recalledText+'」]';
      return speaker+'[id:'+m.id+']：'+m.text;
    }).join('\n');
    const usr = '聊天记录（每条消息有id标记）：\n'+history+'\n\n请生成idol接下来要发送的消息，并根据剧情需要决定是否撤回之前的消息。\n输出 JSON：{"messages":["消息1","消息2",...],"recall_ids":[]}\nrecall_ids填写idol想撤回的自己之前消息的id，不撤回则填[]。';
    const data = await generateJSON(sys, usr);
    if(data && Array.isArray(data.messages) && data.messages.length){
      // Handle recalls first
      if(Array.isArray(data.recall_ids) && data.recall_ids.length){
        data.recall_ids.forEach(rid=>{
          const msg = pd.messages.find(m=>m.id===rid && m.from==='them' && !m.recalled);
          if(msg){ msg.recalledText = msg.text; msg.recalled = true; msg.text = '[撤回]'; }
        });
      }
      const now = Date.now();
      const newMsgs = data.messages
        .filter(text=>text && text.trim())
        .map((text,i)=>({from:'them', text:text.trim(), id:uid('m'), ts:now+i*1000}));
      newMsgs.forEach(m=>pd.messages.push(m));
      saveState();
      // Show notification for first received message
      if(newMsgs.length) showMsgNotification('Chat', ch.idolName||'idol', newMsgs[0].text);
      // Stream: show messages one by one
      const feed = document.getElementById('userChatFeed');
      const allMsgs = pd.messages;
      const existingMsgs = allMsgs.slice(0, allMsgs.length - newMsgs.length);
      feed.innerHTML = renderMsgFeedHtml(existingMsgs, ch, true) || '<div class="empty-state">'+t('empty.dm')+'</div>';
      streamMessages(feed, newMsgs, 1200);
    } else { throw new Error('Could not parse a reply from the API response'); }
  }catch(err){
    console.warn(err);
    showToast(t('toast.genFailed')+': '+(err && err.message ? err.message : String(err)));
  }finally{
    hidePhoneGenerating();
  }
}

async function refreshUserInstagramSection(section){
  const ch = getCurrentChar();
  if(!ch){ showToast(t('toast.charMissing')); return; }
  if(!normalizeBaseUrl(state.settings.apiUrl) || !state.settings.model){ showToast(t('toast.apiMissing')); return; }
  const pd = resolveIgPd('user');
  showGenerating();
  const errors = [];
  const tasks = section==='all' ? ['feed','trending','dm'] : [section];
  for(const task of tasks){
    try{
      if(task==='feed') await userIgRefreshFeed(ch, pd);
      else if(task==='trending') await userIgRefreshTrending(ch, pd);
      else if(task==='dm') await userIgRefreshDm(ch, pd);
    }catch(e){ console.warn(e); errors.push(task); }
  }
  safeRenderInstagram('user');
  hideGenerating();
  if(errors.length) showToast(t('toast.genFailed')+': '+errors.join('、'));
}

function bindAvatarUpload(elId, onLoaded){
  const el = document.getElementById(elId);
  el.addEventListener('click', ()=>{
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = async ()=>{
      if(!input.files || !input.files[0]) return;
      try{
        const dataUrl = await fileToResizedDataUrl(input.files[0], 240);
        onLoaded(dataUrl);
      }catch(err){
        console.warn(err);
        showToast(t('toast.genFailed')+': '+(err && err.message ? err.message : String(err)));
      }
    };
    input.click();
  });
}

function saveCharacterDraft(){
  const d = editingCharDraft;
  if(!d.idolName.trim() && !d.userName.trim()){
    showToast(t('toast.needName'));
    return;
  }
  const existingIdx = state.characters.findIndex(c=>c.id===d.id);
  if(existingIdx>-1) state.characters[existingIdx] = d;
  else state.characters.push(d);
  if(!state.currentCharacterId) state.currentCharacterId = d.id;
  saveState();
  showToast(t('toast.charSaved'));
  goBack();
  renderSettingsCharacters();
  renderHome();
}

function openIconEditor(appKey){
  const def = ICON_CUSTOMIZABLE.find(d=>d.key===appKey);
  const custom = state.settings.customIcons[appKey] || {};
  const overlay = document.getElementById('promptOverlay');
  const card = document.getElementById('promptCard');
  card.innerHTML =
    '<div class="prompt-card-title">'+escapeHtml(def.name)+'</div>'
    + '<div class="avatar-row" style="justify-content:center;margin-bottom:12px;">'
      + '<div class="avatar-upload" id="iconEditorAvatar" style="'+avatarStyle(custom.icon)+'">'+(custom.icon?'':t('btn.uploadImage'))+'</div>'
    + '</div>'
    + '<input type="text" class="field-input" id="iconEditorName" placeholder="'+t('ph.iconName')+'" value="'+escapeHtml(custom.name||'')+'" style="margin-bottom:10px;">'
    + '<div class="prompt-card-actions">'
      + '<button class="pc-cancel" data-v="__reset">'+t('btn.reset')+'</button>'
      + '<button class="pc-ok" data-v="__save">'+t('btn.applyIcon')+'</button>'
    + '</div>';
  overlay.classList.add('open');
  let pendingIcon = custom.icon || '';
  document.getElementById('iconEditorAvatar').addEventListener('click', ()=>{
    const input = document.createElement('input');
    input.type='file'; input.accept='image/*';
    input.onchange = async ()=>{
      if(!input.files || !input.files[0]) return;
      pendingIcon = await fileToResizedDataUrl(input.files[0], 120);
      document.getElementById('iconEditorAvatar').style = avatarStyle(pendingIcon);
      document.getElementById('iconEditorAvatar').textContent = '';
    };
    input.click();
  });
  function close(){ overlay.classList.remove('open'); overlay.removeEventListener('click', onClick); }
  function onClick(e){
    const btn = e.target.closest('[data-v]');
    if(!btn){ if(e.target===overlay) close(); return; }
    const v = btn.getAttribute('data-v');
    if(v==='__save'){
      const name = document.getElementById('iconEditorName').value.trim();
      state.settings.customIcons[appKey] = {name:name, icon:pendingIcon};
      saveState();
      close();
      showToast(t('toast.iconSaved'));
      renderSettingsIcons();
      renderHome();
    } else if(v==='__reset'){
      delete state.settings.customIcons[appKey];
      saveState();
      close();
      showToast(t('toast.iconReset'));
      renderSettingsIcons();
      renderHome();
    } else {
      close();
    }
  }
  overlay.addEventListener('click', onClick);
}

/* ===================================================================
   SELECTION SYSTEM
   - Chat/Bubble/DM: inline mode (circles slide in from left, bar at bottom)
   - Posts/Search/DM-list: overlay mode with separate Edit / Delete buttons
=================================================================== */

/* ---- Overlay mode (for posts, search history, DM list) ---- */
let _selCtx = null;
let _selItems = [];
let _selChecked = new Set();

function openSelOverlay(ctx, items, onDelete, onEdit){
  _selCtx = ctx;
  _selItems = items;
  _selChecked = new Set();
  _selCtx._onDelete = onDelete;
  _selCtx._onEdit = onEdit || null;
  _renderSelOverlay();
  document.getElementById('selOverlay').classList.add('open');
}

function _renderSelOverlay(){
  const list = document.getElementById('selList');
  const label = document.getElementById('selCountLabel');
  const editBtn = document.getElementById('selEditBtn');
  label.textContent = t('sel.countN').replace('{n}', _selChecked.size);
  // Edit only available when exactly 1 selected and edit handler exists
  editBtn.style.display = (_selCtx._onEdit && _selChecked.size===1) ? '' : 'none';

  list.innerHTML = _selItems.map(item=>{
    const checked = _selChecked.has(item.id);
    return '<div class="sel-item'+(checked?' checked':'')+'" data-sel-id="'+escapeHtml(item.id)+'">'
      + '<div class="sel-check'+(checked?' on':'')+'"></div>'
      + '<div class="sel-content">'
        + '<div style="font-size:13.5px;word-break:break-word;">'+escapeHtml(item.label)+'</div>'
        + (item.sublabel ? '<div class="sel-item-meta">'+escapeHtml(item.sublabel)+'</div>' : '')
      + '</div></div>';
  }).join('');

  list.querySelectorAll('.sel-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-sel-id');
      if(_selChecked.has(id)) _selChecked.delete(id); else _selChecked.add(id);
      _renderSelOverlay();
    });
  });
}

function closeSelOverlay(){
  document.getElementById('selOverlay').classList.remove('open');
  _selCtx=null; _selItems=[]; _selChecked=new Set();
}

document.getElementById('selCancelBtn').addEventListener('click', closeSelOverlay);
document.getElementById('selEditBtn').addEventListener('click', ()=>{
  if(_selChecked.size!==1 || !_selCtx._onEdit) return;
  const id=[..._selChecked][0];
  const item=_selItems.find(x=>x.id===id);
  closeSelOverlay();
  _selCtx._onEdit(id, item);
});
document.getElementById('selDeleteBtn').addEventListener('click', ()=>{
  if(_selChecked.size===0){ showToast(t('sel.selectFirst')); return; }
  _selCtx._onDelete([..._selChecked]);
  closeSelOverlay();
});

/* ---- Inline mode (for chat messages, bubble rounds, DM messages) ---- */
/* Each feed gets its own inline selection state */
function createInlineSel(feedId, barId){
  // feedId: element that holds .bubble-row items with data-msg-id
  // barId: the .sel-mode-bar element below the feed
  let checked = new Set();
  let active = false;
  let _onDelete = null;
  let _onEdit = null;
  let _getItems = null; // fn returning [{id, text}]

  function enter(firstId, getItems, onDelete, onEdit){
    active = true; checked = new Set([firstId]);
    _getItems = getItems; _onDelete = onDelete; _onEdit = onEdit;
    render();
    document.getElementById(barId).classList.add('open');
  }
  function exit(){
    active = false; checked = new Set();
    document.getElementById(barId).classList.remove('open');
    const feed = document.getElementById(feedId);
    feed.classList.remove('in-sel-mode');
    feed.querySelectorAll('.sel-circle').forEach(c=>c.remove());
    feed.querySelectorAll('[data-msg-id]').forEach(row=>{
      row.style.transform='';
      row.style.transition='';
    });
  }
  function render(){
    const feed = document.getElementById(feedId);
    feed.classList.add('in-sel-mode');
    // Ensure every selectable row has a circle
    feed.querySelectorAll('[data-msg-id]').forEach(row=>{
      const id = row.getAttribute('data-msg-id');
      let circle = row.querySelector('.sel-circle');
      if(!circle){
        circle = document.createElement('div');
        circle.className = 'sel-circle';
        circle.addEventListener('click', e=>{ e.stopPropagation(); toggle(id); });
        row.insertBefore(circle, row.firstChild);
      }
      circle.classList.toggle('on', checked.has(id));
      row.style.transform = '';
      row.style.transition = '';
    });
    // Update bar count + buttons
    const bar = document.getElementById(barId);
    bar.querySelector('.sel-mode-count').textContent = t('sel.countN').replace('{n}', checked.size);
    const editBtn = bar.querySelector('.sel-mode-edit');
    if(editBtn) editBtn.style.display = (_onEdit && checked.size===1) ? '' : 'none';
    // Always show recall button when bar is open — let the bar-level init handle filtering
    // Emit a custom event so bar-level code can update recall visibility
    bar.dispatchEvent(new CustomEvent('sel-changed', {detail:{checked:[...checked]}}));
  }
  function toggle(id){
    if(checked.has(id)) checked.delete(id); else checked.add(id);
    render();
    // Update recall buttons for dm/chat bars
    if(typeof updateDmSelBarButtons==='function') updateDmSelBarButtons();
    if(typeof updateChatSelBarButtons==='function') updateChatSelBarButtons();
  }
  return {
    isActive(){ return active; },
    enter, exit, render,
    getChecked(){ return [...checked]; },
    getOnDelete(){ return _onDelete; },
    getOnEdit(){ return _onEdit; }
  };
}

/* Helper: attach long-press to a container's elements */
function attachLongPress(container, selector, delay, callback){
  let timer = null;
  container.addEventListener('pointerdown', e=>{
    const el = e.target.closest(selector);
    if(!el) return;
    timer = setTimeout(()=>{ timer=null; callback(el); }, delay||600);
  }, {passive:true});
  ['pointerup','pointercancel','pointermove'].forEach(ev=>
    container.addEventListener(ev, ()=>{ if(timer){ clearTimeout(timer); timer=null; } }, {passive:true})
  );
}

/* ===================================================================
   BUBBLE — inline selection
=================================================================== */
let _bubbleSel = null;

function renderBubble(){
  const ch = getCurrentChar();
  const pd = ensurePhoneData(ch);
  const feed = document.getElementById('bubbleFeed');

  if(!pd.bubble.rounds.length){
    feed.innerHTML = '<div class="empty-state">'+t('empty.bubble')+'</div>';
    return;
  }

  // Ensure all rounds have id
  pd.bubble.rounds.forEach(r=>{ if(!r.id) r.id=uid('r'); });

  feed.innerHTML = pd.bubble.rounds.map(round=>roundHtml(round)).join('');
  feed.querySelectorAll('.expand-toggle').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const roundId = btn.getAttribute('data-round');
      const round = pd.bubble.rounds.find(r=>r.id===roundId);
      if(round){ round.expanded = !round.expanded; renderBubble(); }
    });
  });

  // Long press to enter inline selection
  if(!_bubbleSel) _bubbleSel = createInlineSel('bubbleFeed', 'bubbleSelBar');
  attachLongPress(feed, '[data-msg-id]', 600, (el)=>{
    const id = el.getAttribute('data-msg-id');
    _bubbleSel.enter(id,
      ()=>pd.bubble.rounds.map(r=>({id:r.id, text:r.text})),
      (ids)=>{ pd.bubble.rounds=pd.bubble.rounds.filter(r=>!ids.includes(r.id)); saveState(); _bubbleSel.exit(); renderBubble(); showToast(t('toast.msgDeleted')); },
      (id)=>{ const r=pd.bubble.rounds.find(x=>x.id===id); if(!r) return; showPromptModal(t('sel.editMsg'),r.text,(v)=>{ r.text=v; saveState(); _bubbleSel.exit(); renderBubble(); showToast(t('toast.msgEdited')); }); setTimeout(()=>{ const ta=document.getElementById('promptCardInput'); if(ta) ta.value=r.text; },30); }
    );
  });

  feed.scrollTop = feed.scrollHeight;
}

function roundHtml(round){
  let html = '<div class="bubble-row sent" data-msg-id="'+round.id+'">';
  if(round.photo){

  } else {
    html += '<div class="bubble sent">'+escapeHtml(round.text)+'</div>';
  }
  html += '</div>';
  const repliesCount = (round.replies||[]).length;
  if(repliesCount){
    html += '<button class="expand-toggle" data-round="'+round.id+'">'+(round.expanded? t('expand.hide') : t('expand.show'))+'</button>';

/* Streamed delivery: append messages one by one with delay */
function streamMessages(feed, messages, delay){
  let i=0;
  function next(){
    if(i>=messages.length) return;
    const m = messages[i++];
    const mine = m.from==='me';
    const row = document.createElement('div');
    row.className = 'bubble-row '+(mine?'sent':'recv');
    row.setAttribute('data-msg-id', m.id);
    row.innerHTML = '<div class="bubble '+(mine?'sent':'recv')+'">'+escapeHtml(m.text)+'</div>';
    // Remove empty-state if present
    const es = feed.querySelector('.empty-state');
    if(es) es.remove();
    feed.appendChild(row);
    feed.scrollTop = feed.scrollHeight;
    setTimeout(next, delay||600);
  }
  next();
}

const _igSelState = {}; // keyed by bodyId

function getOrCreateIgSel(scope){
  const bodyId = scope==='idol' ? 'igBody'
    : scope==='idolAlt' ? 'igAltBody'
    : scope==='idol_dm' ? 'igBody'
    : scope==='user_dm' ? 'userIgBody'
    : 'userIgBody';
  const barId = 'igSelBar_'+scope;
  // Ensure sel bar exists
  let bar = document.getElementById(barId);
  if(!bar){
    bar = document.createElement('div');
    bar.id = barId;
    bar.className = 'sel-mode-bar';
    bar.innerHTML = '<div class="sel-mode-actions"><span class="sel-mode-count">'+t('sel.count0')+'</span><button class="sel-mode-delete">'+t('btn.delete')+'</button><button class="sel-mode-cancel">'+t('btn.cancel')+'</button></div>';
    const bodyEl = document.getElementById(bodyId);
    if(bodyEl && bodyEl.parentNode) bodyEl.parentNode.insertBefore(bar, bodyEl.nextSibling);
    bar.querySelector('.sel-mode-cancel').addEventListener('click', ()=>{
      const sel = _igSelState[scope];
      if(sel) sel.exit();
    });
    bar.querySelector('.sel-mode-delete').addEventListener('click', ()=>{
      const sel = _igSelState[scope];
      if(!sel) return;
      const ids = sel.getChecked();
      if(!ids.length){ showToast(t('sel.selectFirst')); return; }
      sel.getOnDelete()(ids);
    });
  }
  if(!_igSelState[scope]){
    _igSelState[scope] = createInlineSel(bodyId, barId);
  }
  return _igSelState[scope];
}

function renderIgBodyWithLongPress(scope){
  const bodyId = scope==='idol' ? 'igBody' : scope==='idolAlt' ? 'igAltBody' : 'userIgBody';
  const body = document.getElementById(bodyId);
  const pane = body.querySelector('.ig-pane.active');

  const pd = resolveIgPd(scope);

  posts.forEach((el,i)=>{
